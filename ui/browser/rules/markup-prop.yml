---
# Markup is never built from a string (ADR-0063). oxlint's react/no-danger reports the attribute written
# in JSX, and this rule reports the same property written as an object key, which reaches an element
# through a spread, h() or createElement without the attribute ever appearing in JSX.
#
# A rule is parsed for one language, so the rule is written once for .ts files and once for .tsx files.
# The violation files are one of each, so banproof turns red if either goes quiet.
id: markup-prop-ts
language: TypeScript
severity: error
message: dangerouslySetInnerHTML parses a string as markup. Message-derived text renders as text only
note: render the text as a child, which escapes it (ADR-0063)
rule:
  any:
  - kind: pair
    has:
      field: key
      regex: ^["'`]?dangerouslySetInnerHTML["'`]?$
  - kind: shorthand_property_identifier
    regex: ^dangerouslySetInnerHTML$
---
id: markup-prop-tsx
language: Tsx
severity: error
message: dangerouslySetInnerHTML parses a string as markup. Message-derived text renders as text only
note: render the text as a child, which escapes it (ADR-0063)
rule:
  any:
  - kind: pair
    has:
      field: key
      regex: ^["'`]?dangerouslySetInnerHTML["'`]?$
  - kind: shorthand_property_identifier
    regex: ^dangerouslySetInnerHTML$
