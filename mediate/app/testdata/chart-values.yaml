---
# Values for TestTheChartRendersAFileTheMediatorStartsWith: every key the chart renders into the mediator's file, the
# optional ones included, on top of the chart's required values.
database:
  port: 6432
  sslmode: verify-ca
secrets:
  databaseCaCertificate:
    existingSecret: database-ca
  credentialSealingKeyPair:
    secretKeys:
      privateKeys:
      - old.key
      - new.key
  mediatorTls:
    existingSecret: mediator-tls
sharedConfig:
  log_level: warn
  scanner:
    triggers:
      en: [code, "log in"]
      "no": [kode, "yes"]
    link_words: [token]
    link_params: [code]
    window: 6
    dense_length: 20
    dense_entropy: 3.5
    weights: {entropy: 1, mix: 0.5, length: 1, proximity: 1, position: 1}
    threshold: 0.7
    subject_threshold: 0.65
mediator:
  database:
    user: mailbox_mediator
    poolSize: 9
  config:
    account_reload_interval: 2m
    provider_timeout: 45s
    log_level: debug
