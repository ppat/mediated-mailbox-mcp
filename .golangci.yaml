          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/core/backfill/"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/schedule$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/series$"
          - "github.com/prometheus/client_golang/prometheus$"
          # The sender classifier's domain functions, which the job kind passes pass 1.
          - "golang.org/x/net/idna$"
          - "golang.org/x/net/publicsuffix$"
          - "pgregory.net/rapid$"

        # Delta sync's job kind in the worker, its shell code and its pure core. A job kind imports its own code,
