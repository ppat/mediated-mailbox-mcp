---
# The one golangci-lint configuration for every Go file in the repository (ADR-0071).
#
# Several settings below restate a default or pick a non-default because the ordinary spelling fails open,
# meaning a rule reads correctly and silently checks nothing. banproof (testsupport/cmd/banproof) runs this
# file unchanged against the checked-in violation files and fails when a rule stops reporting.
version: "2"

run:
  # Files carrying these build tags are linted. Without a tag listed here, depguard and forbidigo skip every
  # file that needs it. banproof adds its own tag on the command line, which golangci-lint appends to these.
  build-tags:
  - integration
  - gmail_live

issues:
  # The defaults hide a second finding on a line and cap repeated findings, which would drop a finding
  # banproof requires, such as one import refused by two lists.
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

formatters:
  enable:
  - gofumpt
  - goimports
  settings:
    gofumpt:
      module-path: github.com/ppat/mediated-mailbox-mcp
    goimports:
      local-prefixes:
      - github.com/ppat/mediated-mailbox-mcp

linters:
  default: none
  enable:
  # Linters standing in for controls. Each is proven by violation files, and nothing may suppress its findings.
  - depguard
  - errcheck
  - exhaustive
  - forbidigo
  # Ordinary linters. banproof's list of ordinary linters names exactly these, and only they may be named by a
  # //nolint directive or an exclusion rule. A linter that comes to carry a control leaves both lists.
  - bodyclose
  - errorlint
  - gosec
  - govet
  - ineffassign
  - misspell
  - revive
  - staticcheck
  - unused

  exclusions:
    # The default excludes every finding in a file whose header says it is generated, so a hand-written
    # header would switch off every rule in that file.
    generated: disable
    presets: []
    rules:
    # A violation file breaks a control on purpose and banproof requires exactly its wanted findings, so the
    # ordinary linters' opinions of it are not reported.
    - path: _violation(_[a-z]+)?(_test)?\.go$
      linters: [bodyclose, errorlint, gosec, govet, ineffassign, misspell, revive, staticcheck, unused]
    # Test code and the test tooling under testsupport run the commands and read the files that the repository
    # or their caller names, and none of that code reaches a shipped binary (the non-test-code import list).
    - path: (_test\.go$|^testsupport/)
      linters: [gosec]
      text: '^G(204|304):'

  settings:
    gosec:
      config:
        global:
          # gosec otherwise honours its own #nosec comment, which needs no reason. A false positive is
          # suppressed with //nolint:gosec and a reason instead, the one form banproof checks.
          nosec: true

    revive:
      # revive otherwise honours its own disable comment with no reason given.
      directives:
      - name: specify-disable-reason
        severity: error
      # Rules that staticcheck's default checks leave out. Listing any rule switches revive's defaults off.
      rules:
      - name: blank-imports
      - name: context-as-argument
      - name: dot-imports
      - name: error-return
      - name: exported
      - name: package-comments
      - name: receiver-naming
      - name: redefines-builtin-id
      - name: time-naming
      - name: unexported-return
      - name: unreachable-code
      - name: var-naming

    errcheck:
      check-blank: true
      check-type-assertions: true

    exhaustive:
      # Its default, written out. The deny-defaulting default branch every verdict switch carries would
      # otherwise silence the check.
      default-signifies-exhaustive: false

    forbidigo:
      # With type analysis off, a pattern carrying pkg matches nothing, and an aliased import escapes.
      analyze-types: true
      # The default skips Example functions in test files.
      exclude-godoc-examples: false
      forbid:
      - pattern: ^rapid\.(Make|MakeCustom)$
        pkg: ^pgregory\.net/rapid$
        msg: generators build values through exported constructors inside rapid.Custom (ADR-0069)
      - pattern: ^cmpopts\.IgnoreUnexported$
        pkg: ^github\.com/google/go-cmp/cmp/cmpopts$
        msg: it reports no difference between values that differ in unexported fields (ADR-0070)
      # The package-level default registry, the helpers that use it, and the constructors that register into it.
      # Each process builds its own registry and passes it where metrics are registered (ADR-0076).
      - pattern: ^prometheus\.(DefaultRegisterer|DefaultGatherer|MustRegister|Register|Unregister)$
        pkg: ^github\.com/prometheus/client_golang/prometheus$
        msg: a process registers its metrics on the registry it builds, never the default one (ADR-0076)
      - pattern: ^promauto\.New
        pkg: ^github\.com/prometheus/client_golang/prometheus/promauto$
        msg: promauto's constructors without a registry register into the default one (ADR-0076)
      - pattern: ^promhttp\.Handler$
        pkg: ^github\.com/prometheus/client_golang/prometheus/promhttp$
        msg: it serves the default registry, and a process serves its own through promhttp.HandlerFor (ADR-0076)
      # The process's default loggers and the built-in print functions. Every Go file logs through a logger it was
      # handed. main.go makes its logger the default only for code the project does not own, so the setters stay
      # allowed (ADR-0122).
      - pattern: ^slog\.(Default|Debug|DebugContext|Info|InfoContext|Warn|WarnContext|Error|ErrorContext|Log|LogAttrs)$
        pkg: ^log/slog$
        msg: code logs through the logger it was handed, never the process default (ADR-0122)
      - pattern: ^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln|Output|Default|Writer)$
        pkg: ^log$
        msg: code logs through the logger it was handed, never the process default (ADR-0122)
      - pattern: ^(print|println)$
        msg: a built-in print writes plain text to standard error, outside the handed logger (ADR-0122)

    depguard:
      # How to read these lists.
      #
      # - Every list is strict, so an import is refused unless an allow entry admits it. No list has a deny entry.
      # - A file matched by several lists must satisfy all of them. A file matched by none is not checked, so
      #   the residual list at the end catches files outside every component.
      # - Allow entries are string prefixes. An entry ending in $ is exact. Standard-library entries in the
      #   pure-core lists are exact, because a prefix os would also admit os/exec. Project entries end in / or $.
      # - depguard checks only one sorted neighbour per import, so an exact entry must not sit under a shorter
      #   prefix entry of the same path, or the prefix stops admitting its other subpackages.
      # - File globs match absolute paths. Every project glob starts with ${base-path}, the directory of this
      #   file, so a parent directory of the checkout with the same name cannot match. dir/**.go matches files
      #   directly in dir, and dir/**/*.go does not.
      # - $gostd admits every standard-library package through one entry per top-level name, such as go. An entry
      #   for a module whose path starts with go. sorts between go and go/ast and hides every go/ package, so a
      #   list holding such an entry also lists go/.
      rules:

        # Non-test files of every pure-core package, in any component, matched by a path element named core at any
        # depth (ADR-0040, ADR-0071). Every entry outside this project meets ADR-0071's four conditions for a pure
        # core's imports, together with everything it imports.
        pure-core:
          list-mode: strict
          files:
          - "${base-path}/core/**.go"
          - "${base-path}/**/core/**.go"
          - "!$test"
          allow:
          - "bytes$"
          - "cmp$"
          # The base64 a Gmail body part's data comes in, which the Gmail adapter's body decision decodes.
          - "encoding/base64$"
          - "errors$"
          - "iter$"
          - "maps$"
          - "math$"
          - "math/bits$"
          - "regexp$"
          - "slices$"
          - "sort$"
          - "strconv$"
          - "strings$"
          - "unicode$"
          - "unicode/utf8$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/core/"
          - "github.com/ppat/mediated-mailbox-mcp/provider/ratelimit/core/"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/core/"
          # The worker's pure cores another of its pure cores builds on: the first pass's, whose bound on
          # attempts the second pass's shares, the gate-and-scan loop's counting, which the second pass's
          # progress counts with, and the runs' lifecycle, which both passes and backfill's seed start from.
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/backfill/pass1/core$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/index/core$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/runs/core$"
          # The encoding interface a charset's decoder is, which the Gmail adapter's body decision decodes a part
          # held apart through. The label table that maps a label to a decoder imports fmt, which imports os, so
          # the adapter passes it in (ADR-0134).
          - "golang.org/x/text/encoding$"

        # Test files of every pure-core package. What the non-test files may import, plus test tooling and the
        # functions a shell passes in.
        pure-core-tests:
          list-mode: strict
          files:
          - "${base-path}/core/**_test.go"
          - "${base-path}/**/core/**_test.go"
          allow:
          - "bytes$"
          - "cmp$"
          - "encoding/base64$"
          - "errors$"
          - "iter$"
          - "maps$"
          - "math$"
          - "math/bits$"
          - "regexp$"
          - "slices$"
          - "sort$"
          - "strconv$"
          - "strings$"
          - "unicode$"
          - "unicode/utf8$"
          - "testing$"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/google/go-cmp/cmp/cmpopts$"
          # The punycode decoding and the public-suffix list a shell passes to the sender classifier, so its tests run
          # against the real lookups. Neither is pure, so neither is on the pure-core list for non-test files.
          - "golang.org/x/net/idna$"
          - "golang.org/x/net/publicsuffix$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/core/"
          # The rate limiter's pure core is one package rather than a directory of packages, so its external tests
          # import it by its exact path.
          - "github.com/ppat/mediated-mailbox-mcp/provider/ratelimit/core$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/ratelimit/core/"
          # The Gmail adapter's pure core is one package too, and so is the database package's.
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail/gmail/core$"
          - "github.com/ppat/mediated-mailbox-mcp/process/database/core$"
          - "github.com/ppat/mediated-mailbox-mcp/content/markdown/core$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx/core$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/fixture$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/marker$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/property$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/core/"
          # Each of the worker's pure cores is one package beside the shell code that uses it, so its
          # external tests import it by its exact path, and the cores it builds on are those above.
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/backfill/core$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/backfill/pass1/core$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/backfill/pass2/core$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/backfill/start/core$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/deltasync/core$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/deltasync/tick/core$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/index/core$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/runs/core$"
          # The encoding interface the Gmail adapter's body decision decodes through, and the media-type parser
          # and the charset label table the adapter passes it, so its tests run against the real lookups. Neither
          # of the last two is pure, so neither is on the pure-core list for non-test files.
          - "golang.org/x/text/encoding$"
          - "golang.org/x/text/encoding/htmlindex$"
          - "mime$"
          - "pgregory.net/rapid$"

        # The sealing half of the credential family, every file. It never names the opening half, which imports it.
        credential-seal:
          list-mode: strict
          files:
          - "${base-path}/credential/seal/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/ppat/mediated-mailbox-mcp/credential/seal$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"

        # The opening half of the credential family, every file.
        credential-open:
          list-mode: strict
          files:
          - "${base-path}/credential/open/**.go"
          allow:
          - "$gostd"
          - "github.com/ppat/mediated-mailbox-mcp/credential/open$"
          - "github.com/ppat/mediated-mailbox-mcp/credential/seal$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"

        # The command-line program, every file. Its keygen subcommand takes the suite and the key identifier from the
        # sealing half, its tests open the pair it writes with the opening half, and its -version flag prints the
        # release version (ADR-0078, ADR-0088).
        cli:
          list-mode: strict
          files:
          - "${base-path}/cli/**.go"
          allow:
          - "$gostd"
          - "github.com/ppat/mediated-mailbox-mcp/cli/internal/keygen$"
          - "github.com/ppat/mediated-mailbox-mcp/credential/open$"
          - "github.com/ppat/mediated-mailbox-mcp/credential/seal$"
          - "github.com/ppat/mediated-mailbox-mcp/process/version$"

        # The migrator, every file outside its task's package: its entry, which holds its spec and nothing else, and
        # its main.go, which hands the process the spec (ADR-0142). The spec names the task's Build, so it admits the
        # task's package and no data-access subsection, no db/migrate and no goose, which the task alone reaches. Its
        # tests run the spec through the process, render the chart and run it against a test database, and the
        # integration test reads the chain db/migrations embeds to compare with what was applied.
        migrator:
          list-mode: strict
          files:
          - "${base-path}/migrator/**.go"
          - "!${base-path}/migrator/internal/migrate/**"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/ppat/mediated-mailbox-mcp/core/config$"
          - "github.com/ppat/mediated-mailbox-mcp/db/migrations$"
          - "github.com/ppat/mediated-mailbox-mcp/migrator/app$"
          - "github.com/ppat/mediated-mailbox-mcp/migrator/internal/migrate$"
          - "github.com/ppat/mediated-mailbox-mcp/process$"
          - "github.com/ppat/mediated-mailbox-mcp/process/settings$"
          - "github.com/ppat/mediated-mailbox-mcp/process/version$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/helmchart$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"

        # The migrator's task, every file. Its Build opens the migrator's pool through process/database and returns
        # the work that applies the chain db/migrations embeds through db/migrate, the one package goose is admitted
        # to, over the driver's database/sql handle (ADR-0139, ADR-0142).
        migrator-migrate:
          list-mode: strict
          files:
          - "${base-path}/migrator/internal/migrate/**.go"
          allow:
          - "$gostd"
          - "github.com/jackc/pgx/v5/stdlib$"
          - "github.com/ppat/mediated-mailbox-mcp/core/config$"
          - "github.com/ppat/mediated-mailbox-mcp/db/migrate$"
          - "github.com/ppat/mediated-mailbox-mcp/db/migrations$"
          - "github.com/ppat/mediated-mailbox-mcp/process$"
          - "github.com/ppat/mediated-mailbox-mcp/process/database$"

        # The process's spec and its run, every file of the family's root package, which runs one program as a
        # process through the family's other packages and holds its slots, and nothing of any program (ADR-0142).
        # client_golang is admitted for the registry it builds, the registerers it hands out, the runtime collectors it
        # registers and the metrics endpoint it serves (ADR-0051, ADR-0125). Its tests compare through the shared
        # options value (ADR-0070) and assert a must-not-compile spec's type errors.
        process:
          list-mode: strict
          files:
          - "${base-path}/process/*.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/ppat/mediated-mailbox-mcp/core/config$"
          - "github.com/ppat/mediated-mailbox-mcp/process$"
          - "github.com/ppat/mediated-mailbox-mcp/process/logging$"
          - "github.com/ppat/mediated-mailbox-mcp/process/schedule$"
          - "github.com/ppat/mediated-mailbox-mcp/process/settings$"
          - "github.com/ppat/mediated-mailbox-mcp/process/version$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "github.com/prometheus/client_golang/prometheus$"
          - "github.com/prometheus/client_golang/prometheus/collectors$"
          - "github.com/prometheus/client_golang/prometheus/promhttp$"

        # The database, every file, a package of the process family, with its pure core. It builds the connection a
        # program's database part describes, connects as no role of its own, opens and measures every pool and runs
        # the schema check, whose statement is the start check's subsection and whose comparison sits beside the chain
        # (ADR-0078, ADR-0125, ADR-0140). It keeps its pools in a slot of the process. Its tests run statements
        # through the transaction helper against the test database, and assert that only the migrator's
        # configuration type can ask for the migrator's pool.
        database:
          list-mode: strict
          files:
          - "${base-path}/process/database/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/pgxpool$"
          - "github.com/ppat/mediated-mailbox-mcp/core/config$"
          - "github.com/ppat/mediated-mailbox-mcp/db/migrations$"
          - "github.com/ppat/mediated-mailbox-mcp/db/schemacompatibility$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"
          - "github.com/ppat/mediated-mailbox-mcp/process$"
          - "github.com/ppat/mediated-mailbox-mcp/process/database$"
          - "github.com/ppat/mediated-mailbox-mcp/process/database/core$"
          - "github.com/ppat/mediated-mailbox-mcp/process/schedule$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          - "github.com/prometheus/client_golang/prometheus$"

        # The scheduler, every file, a package of the process family. It runs each job kind's plan and every job on
        # the standard library alone, and registers the jobs' series on the registerer it is handed (ADR-0119). Its
        # tests compare through the shared options value (ADR-0070).
        schedule:
          list-mode: strict
          files:
          - "${base-path}/process/schedule/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/ppat/mediated-mailbox-mcp/process/schedule$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/alertingrules$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/prometheus/client_golang/prometheus$"

        # The reading of the list of accounts, every file, a package of the process family. It reads the listing,
        # which belongs to no account, and holds no credential. db/check plans its statement under the application
        # user, as it does every list's (ADR-0066, ADR-0091, ADR-0143). Its tests read through a pool as that user.
        accounts:
          list-mode: strict
          files:
          - "${base-path}/process/accounts/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/"
          - "github.com/ppat/mediated-mailbox-mcp/db/accounts$"
          - "github.com/ppat/mediated-mailbox-mcp/process/accounts$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"

        # Each account's policy, every file, a package of the process family. It reads the policy tables through
        # core/policy and prepares each account's policy for the classifier with the domain lookups
        # process/domains holds. client_golang is admitted for the reload-failure series and the load's duration
        # (ADR-0041, ADR-0076, ADR-0077, ADR-0125). db/check plans the statements of the subsection it names under
        # the application user (ADR-0066, ADR-0143).
        policies:
          list-mode: strict
          files:
          - "${base-path}/process/policies/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/"
          - "github.com/ppat/mediated-mailbox-mcp/core/classify$"
          - "github.com/ppat/mediated-mailbox-mcp/core/policy$"
          - "github.com/ppat/mediated-mailbox-mcp/db/policyrules$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"
          - "github.com/ppat/mediated-mailbox-mcp/process/domains$"
          - "github.com/ppat/mediated-mailbox-mcp/process/policies$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/alertingrules$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          - "github.com/prometheus/client_golang/prometheus$"

        # The Session, every file, a package of the process family. It imports the reading of the list and the
        # policies, and no credential and no provider code, and never the connections, which attach to it through a
        # small interface, so code that holds the Session reaches a credential only through the connections' own
        # package (ADR-0117, ADR-0142). It reloads on the process's scheduler and opens the process's pool. Its tests
        # run it in a process over the test database.
        sessions:
          list-mode: strict
          files:
          - "${base-path}/process/sessions/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/pgxpool$"
          - "github.com/ppat/mediated-mailbox-mcp/core/classify$"
          - "github.com/ppat/mediated-mailbox-mcp/core/config$"
          - "github.com/ppat/mediated-mailbox-mcp/process$"
          - "github.com/ppat/mediated-mailbox-mcp/process/accounts$"
          - "github.com/ppat/mediated-mailbox-mcp/process/database$"
          - "github.com/ppat/mediated-mailbox-mcp/process/policies$"
          - "github.com/ppat/mediated-mailbox-mcp/process/schedule$"
          - "github.com/ppat/mediated-mailbox-mcp/process/sessions$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          - "github.com/prometheus/client_golang/prometheus$"

        # Each account's connection to its provider, every file, a package of the process family, and the one package
        # of the family admitted the opening half of the credential family. It opens each stored credential and
        # client secret, makes each account's token and each unit's mailbox through the provider library's calling
        # side, and writes a rotated credential and a re-sealed value back, as the application user, which db/check
        # plans its statements under (ADR-0066, ADR-0081, ADR-0089, ADR-0092, ADR-0143). It admits no adapter and no
        # rate limiter. Its tests run it in a process over the provider fake and the test database.
        connections:
          list-mode: strict
          files:
          - "${base-path}/process/connections/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/"
          - "github.com/ppat/mediated-mailbox-mcp/core/config$"
          - "github.com/ppat/mediated-mailbox-mcp/core/mail$"
          - "github.com/ppat/mediated-mailbox-mcp/credential/open$"
          - "github.com/ppat/mediated-mailbox-mcp/credential/seal$"
          - "github.com/ppat/mediated-mailbox-mcp/db/accounts$"
          - "github.com/ppat/mediated-mailbox-mcp/db/accountstate$"
          - "github.com/ppat/mediated-mailbox-mcp/db/accountstate/credential$"
          - "github.com/ppat/mediated-mailbox-mcp/db/oauthclients$"
          - "github.com/ppat/mediated-mailbox-mcp/db/oauthclients/secret$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"
          - "github.com/ppat/mediated-mailbox-mcp/process$"
          - "github.com/ppat/mediated-mailbox-mcp/process/accounts$"
          - "github.com/ppat/mediated-mailbox-mcp/process/connections$"
          - "github.com/ppat/mediated-mailbox-mcp/process/database$"
          - "github.com/ppat/mediated-mailbox-mcp/process/schedule$"
          - "github.com/ppat/mediated-mailbox-mcp/process/sessions$"
          - "github.com/ppat/mediated-mailbox-mcp/provider$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail/fake$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"

        # The domain lookups every program classifies senders with, every file, a package of the process family. It
        # chooses the IDNA conversions and the public suffix list the sender classifier normalizes domains through,
        # which the pure core cannot import, and hands them over as classify.Lookups (ADR-0004, ADR-0040, ADR-0136).
        domains:
          list-mode: strict
          files:
          - "${base-path}/process/domains/**.go"
          allow:
          - "$gostd"
          - "github.com/ppat/mediated-mailbox-mcp/core/classify$"
          - "golang.org/x/net/idna$"
          - "golang.org/x/net/publicsuffix$"

        # The process's one scanner and the body-processing histogram, every file, a package of the process family.
        # It builds the scanner through core/scan from the scanner part under the revision the process holds
        # (ADR-0120, ADR-0125). Its tests run it in a process.
        scanner:
          list-mode: strict
          files:
          - "${base-path}/process/scanner/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/ppat/mediated-mailbox-mcp/core/config$"
          - "github.com/ppat/mediated-mailbox-mcp/core/scan$"
          - "github.com/ppat/mediated-mailbox-mcp/process$"
          - "github.com/ppat/mediated-mailbox-mcp/process/schedule$"
          - "github.com/ppat/mediated-mailbox-mcp/process/scanner$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/prometheus/client_golang/prometheus$"

        # The logger, every file, a package of the process family. It builds a logger over the standard library
        # alone, refuses a level through core/config's check of the process part, which holds the level names, and
        # its tests compare through the shared options value (ADR-0122, ADR-0070).
        logging:
          list-mode: strict
          files:
          - "${base-path}/process/logging/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/ppat/mediated-mailbox-mcp/core/config$"
          - "github.com/ppat/mediated-mailbox-mcp/process/logging$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"

        # The release version, every file, a package of the process family. It holds one constant, and its test reads
        # the files the release cut writes the same version into.
        version:
          list-mode: strict
          files:
          - "${base-path}/process/version/**.go"
          allow:
          - "$gostd"
          - "github.com/ppat/mediated-mailbox-mcp/process/version$"

        # The data-access library, every file but the application of the migration chain, whose list follows.
        db:
          list-mode: strict
          files:
          - "${base-path}/db/**.go"
          - "!${base-path}/db/migrate/**"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/google/go-cmp/cmp/cmpopts$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/"
          - "github.com/pganalyze/pg_query_go/v6$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/db/"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/crash$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/fixture$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/property$"
          - "github.com/wasilibs/go-pgquery$"
          - "go.yaml.in/yaml/v3$"
          # Restores the standard library under go/, which the entry above hides (see the notes at the top).
          - "go/"
          - "google.golang.org/protobuf/reflect/protoreflect$"
          - "pgregory.net/rapid$"

        # The application of the migration chain, every file, the one package goose is admitted to (ADR-0139). Its
        # tests apply a chain beside the one db/migrations embeds to a test database through the driver's database/sql
        # adapter.
        db-migrate:
          list-mode: strict
          files:
          - "${base-path}/db/migrate/**.go"
          allow:
          - "$gostd"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/stdlib$"
          - "github.com/ppat/mediated-mailbox-mcp/db/migrate$"
          - "github.com/ppat/mediated-mailbox-mcp/db/migrations$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          - "github.com/pressly/goose/v3$"
          - "github.com/pressly/goose/v3/lock$"

        # The provider library, every file outside the calling side, the Gmail adapter and the rate limiter, which
        # have lists of their own. Its exact entries leave out the adapters and their pure cores, so no package here
        # links an adapter's core, which only its adapter may (ADR-0071).
        provider:
          list-mode: strict
          files:
          - "${base-path}/provider/**.go"
          - "!${base-path}/provider/*.go"
          - "!${base-path}/provider/mail/gmail/**"
          - "!${base-path}/provider/ratelimit/**"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/google/go-cmp/cmp/cmpopts$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/provider/consent$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/google$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/internal/adapters$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail/contract$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail/fake$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/fixture$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/marker$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "pgregory.net/rapid$"

        # The provider library's calling side, the files of provider itself. It builds each caller's adapters, rate
        # limiter and provider series, so it alone in the library names an adapter and the rate limiter, and its
        # leases run on the pool it is handed. client_golang is admitted for the shared provider series every adapter
        # counts its requests on (ADR-0076, ADR-0077).
        provider-calling:
          list-mode: strict
          files:
          - "${base-path}/provider/*.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/pgxpool$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"
          - "github.com/ppat/mediated-mailbox-mcp/provider$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/google$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/internal/adapters$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail/fake$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail/gmail$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/ratelimit$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/ratelimit/core$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          - "github.com/prometheus/client_golang/prometheus$"

        # The Gmail adapter and its pure core, every file. The adapter alone is admitted its core.
        provider-gmail:
          list-mode: strict
          files:
          - "${base-path}/provider/mail/gmail/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/provider/google$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail/contract$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail/gmail$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail/gmail/core$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/livecontract$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/marker$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          # The WHATWG Encoding Standard's charset labels, which the Gmail adapter decodes a body part held
          # apart from its message by, since Gmail returns that part in its declared charset, and the encoding
          # interface its body decision decodes through (ADR-0134).
          - "golang.org/x/text/encoding$"
          - "golang.org/x/text/encoding/htmlindex$"

        # Non-test files of the provider fake and the contract suite, which only tests use. The list for
        # non-test code excludes them, so this list keeps rapid out of them.
        provider-test-code:
          list-mode: strict
          files:
          - "${base-path}/provider/mail/fake/**.go"
          - "${base-path}/provider/mail/contract/**.go"
          - "!$test"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/provider/google$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/internal/adapters$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/fixture$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/marker$"

        # The rate limiter, provider/ratelimit, every file. Its pure rules under provider/ratelimit/core also meet the
        # pure-core lists. db/check plans the statements of the subsections it names under the application user, as it
        # does every list's (ADR-0066, ADR-0143).
        ratelimit:
          list-mode: strict
          files:
          - "${base-path}/provider/ratelimit/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/google/go-cmp/cmp/cmpopts$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/db/accountstate$"
          - "github.com/ppat/mediated-mailbox-mcp/db/ratestate/limiter$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail/fake$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/ratelimit$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/ratelimit/core$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/alertingrules$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/crash$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/fixture$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/property$"
          - "github.com/prometheus/client_golang/prometheus$"
          - "github.com/prometheus/client_model/go$"
          - "go.yaml.in/yaml/v3$"
          - "pgregory.net/rapid$"

        # The message content family, every file. It is the one place the HTML-to-Markdown converter and the HTML
        # parser it reads are admitted, and the CommonMark parser is admitted for its tests, which read the output as a
        # Markdown reader would.
        content:
          list-mode: strict
          files:
          - "${base-path}/content/**.go"
          allow:
          - "$gostd"
          - "github.com/JohannesKaufmann/html-to-markdown/v2/"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/google/go-cmp/cmp/cmpopts$"
          - "github.com/ppat/mediated-mailbox-mcp/content/"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/fixture$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/marker$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/property$"
          - "github.com/yuin/goldmark$"
          - "github.com/yuin/goldmark/"
          - "golang.org/x/net/html$"
          - "golang.org/x/net/html/atom$"
          - "pgregory.net/rapid$"

        # The message content family outside its conversion package. The converter is called from content/markdown
        # alone, so the API server and the Backfill Job convert with one configuration.
        content-without-converter:
          list-mode: strict
          files:
          - "${base-path}/content/**.go"
          - "!${base-path}/content/markdown/**"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/google/go-cmp/cmp/cmpopts$"
          - "github.com/ppat/mediated-mailbox-mcp/content/"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/fixture$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/property$"
          - "pgregory.net/rapid$"

        # The configuration library, every file, a package of the process family. The YAML decoder is the one module
        # it adds, and core/config's length of time is the one type of the configuration types it reads and writes by
        # name (ADR-0078).
        settings:
          list-mode: strict
          files:
          - "${base-path}/process/settings/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/ppat/mediated-mailbox-mcp/core/config$"
          - "github.com/ppat/mediated-mailbox-mcp/process/settings$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "go.yaml.in/yaml/v3$"
          # Restores the standard library under go/, which the entry above hides (see the notes at the top).
          - "go/"

        # The shared test tooling, every file.
        testsupport:
          list-mode: strict
          files:
          - "${base-path}/testsupport/**.go"
          - "!${base-path}/testsupport/cmd/keypaircheck/**"
          allow:
          - "$gostd"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/google/go-cmp/cmp/cmpopts$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/db/"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/"
          # banproof reads .golangci.yaml, and helmchart decodes the rendered chart.
          - "go.yaml.in/yaml/v3$"
          # Restores the standard library under go/, which the entry above hides (see the notes at the top).
          - "go/"
          - "golang.org/x/tools/go/"
          - "pgregory.net/rapid$"

        # The shared test tooling outside the rapid-based packages, the mutation runner's property test of where a
        # hunk matches (ADR-0069), and the analyser's violation files, which call rapid because the rules they break
        # are about calls into it (ADR-0071).
        testsupport-without-rapid:
          list-mode: strict
          files:
          - "${base-path}/testsupport/**.go"
          - "!${base-path}/testsupport/property/**"
          - "!${base-path}/testsupport/crash/**"
          - "!${base-path}/testsupport/cmd/mutproof/internal/hunkmatch/**_property_test.go"
          - "!${base-path}/testsupport/analysis/**_violation_test.go"
          - "!${base-path}/testsupport/cmd/keypaircheck/**"
          allow:
          - "$gostd"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/google/go-cmp/cmp/cmpopts$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/db/"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/analysis$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/cmd/mutproof/internal/hunkmatch$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/fixture$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/livecontract$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/marker$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          # banproof reads .golangci.yaml, and helmchart decodes the rendered chart.
          - "go.yaml.in/yaml/v3$"
          # Restores the standard library under go/, which the entry above hides (see the notes at the top).
          - "go/"
          - "golang.org/x/tools/go/"

        # The check of a key pair a released key-generation binary writes, every file. It seals and opens with the
        # credential library, which no other test tooling links (ADR-0088).
        keypaircheck:
          list-mode: strict
          files:
          - "${base-path}/testsupport/cmd/keypaircheck/**.go"
          allow:
          - "$gostd"
          - "github.com/ppat/mediated-mailbox-mcp/credential/open$"
          - "github.com/ppat/mediated-mailbox-mcp/credential/seal$"

        # Deployable api, every non-test file but the MCP root's generator, the body operation's provider functions and
        # the registry's build. A deployable imports its own code and the shared libraries, never another deployable
        # (ADR-0054). It names each data-access subsection it may use, which db/check tests against the application
        # user's grants, and which bounds what its code can do in the database (ADR-0143). It admits neither the
        # connections nor any of the provider library, so the service layer and every other package of the API server
        # reach a provider only through api/internal/bodies, and the rate limiter only through api/internal/registry,
        # whose own lists below govern them (ADR-0030, ADR-0117, ADR-0142). The MCP root's generator is left out,
        # because it alone imports the MCP SDK, and its own list governs it.
        api:
          list-mode: strict
          files:
          - "${base-path}/api/**.go"
          - "!${base-path}/api/internal/mcp/mcp.go"
          - "!${base-path}/api/internal/bodies/**"
          - "!${base-path}/api/internal/registry/**"
          - "!$test"
          allow:
          - "$gostd"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/db/accountstate$"
          # The audit row of each body served or denied, a write only the API server's list admits (ADR-0016).
          - "github.com/ppat/mediated-mailbox-mcp/db/auditlog/record$"
          - "github.com/ppat/mediated-mailbox-mcp/db/jobruns$"
          - "github.com/ppat/mediated-mailbox-mcp/db/maskingevents$"
          - "github.com/ppat/mediated-mailbox-mcp/db/messages$"
          - "github.com/ppat/mediated-mailbox-mcp/db/ratestate$"
          # The sender statistics the sender listing reads, apart from their writes, which sit in
          # db/senders/statistics and db/messages/change (ADR-0109).
          - "github.com/ppat/mediated-mailbox-mcp/db/senders$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"
          - "github.com/ppat/mediated-mailbox-mcp/api/"
          # The spec, the capabilities each endpoint is built with and the slot the bearer token's report is kept in
          # (ADR-0142).
          - "github.com/ppat/mediated-mailbox-mcp/process$"

        # The API server's entry, which holds its spec and nothing else, and its main.go, which hands the process the
        # spec. It runs no statement and builds no part, each part being built by the Build of its own package, which
        # the spec names, so a data-access subsection, the Session, the connections, the registry's build and the body
        # conversion are each refused (ADR-0142).
        api-app:
          list-mode: strict
          files:
          - "${base-path}/api/app/**.go"
          - "${base-path}/api/main.go"
          - "!$test"
          allow:
          - "$gostd"
          - "github.com/ppat/mediated-mailbox-mcp/api/app$"
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/api$"
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/mcp$"
          - "github.com/ppat/mediated-mailbox-mcp/core/config$"
          - "github.com/ppat/mediated-mailbox-mcp/process$"

        # What the body operation needs of a provider, the one package of the API server that begins a unit of work,
        # so the one admitted the connections, and the provider library's calling side for the caller's class. It is
        # refused the rate limiter, which only the registry's build reaches, for the rate-state collector (ADR-0142).
        api-bodies:
          list-mode: strict
          files:
          - "${base-path}/api/internal/bodies/**.go"
          - "!$test"
          allow:
          - "$gostd"
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/service$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/process$"
          - "github.com/ppat/mediated-mailbox-mcp/process/connections$"
          - "github.com/ppat/mediated-mailbox-mcp/process/database$"
          - "github.com/ppat/mediated-mailbox-mcp/process/sessions$"
          - "github.com/ppat/mediated-mailbox-mcp/provider$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail$"

        # The build of the API server's one registry of operations, the one package of the API server admitted the
        # rate limiter, for F3's rate-state collector registered beside the registry, and the provider library's
        # calling side for the facts about each provider (ADR-0077, ADR-0142). It is refused the connections, which the
        # body operation reaches only through api/internal/bodies.
        api-registry:
          list-mode: strict
          files:
          - "${base-path}/api/internal/registry/**.go"
          - "!$test"
          allow:
          - "$gostd"
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/bodies$"
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/service$"
          - "github.com/ppat/mediated-mailbox-mcp/content/markdown$"
          - "github.com/ppat/mediated-mailbox-mcp/content/markdown/core$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/process$"
          - "github.com/ppat/mediated-mailbox-mcp/process/database$"
          - "github.com/ppat/mediated-mailbox-mcp/process/scanner$"
          - "github.com/ppat/mediated-mailbox-mcp/process/sessions$"
          - "github.com/ppat/mediated-mailbox-mcp/provider$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/ratelimit$"
          - "github.com/prometheus/client_golang/prometheus$"

        # The bearer-token check, the no-store header and the token file's readiness report, which wrap a root's
        # handler. It reaches no operation, so the service layer, the registry's build, the body operation's provider
        # functions and every data-access subsection are refused it (ADR-0053, ADR-0071).
        api-bearer:
          list-mode: strict
          files:
          - "${base-path}/api/internal/bearer/**.go"
          - "!$test"
          allow:
          - "$gostd"
          - "github.com/ppat/mediated-mailbox-mcp/core/config$"
          - "github.com/ppat/mediated-mailbox-mcp/process$"

        # Deployable api, every test file. Its tests run the API server through its spec over the provider fake, which
        # they hand the process through the connections' one option for a test, and may use test tooling, which the
        # lists for non-test code refuse (ADR-0142). They seal credentials and never open one.
        api-tests:
          list-mode: strict
          files:
          - "${base-path}/api/**_test.go"
          allow:
          - "$gostd"
          - "github.com/getkin/kin-openapi/openapi3$"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/google/go-cmp/cmp/cmpopts$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/"
          - "github.com/ppat/mediated-mailbox-mcp/api/"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/credential/seal$"
          - "github.com/ppat/mediated-mailbox-mcp/process$"
          - "github.com/ppat/mediated-mailbox-mcp/process/connections$"
          - "github.com/ppat/mediated-mailbox-mcp/process/policies$"
          - "github.com/ppat/mediated-mailbox-mcp/process/settings$"
          - "github.com/ppat/mediated-mailbox-mcp/process/version$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail/fake$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/crash$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/fixture$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/helmchart$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/marker$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/property$"
          - "github.com/prometheus/client_golang/prometheus$"
          - "pgregory.net/rapid$"

        # Deployable ui, every file outside its entry and its setup, ui/internal/setup with its client-secret package. A
        # deployable imports its own code and the shared libraries, never another deployable (ADR-0054). Its tests may
        # also use test tooling, which the list for non-test code refuses. It names each data-access subsection it may
        # use, which db/check tests against the application user's grants, and which bounds what its code can do in the
        # database (ADR-0143). It admits neither the provider adapters nor the rate limiter, because the UI holds no
        # provider credential, cannot reach a mailbox and does not spend the rate budget (ADR-0038, ADR-0021, ADR-0025).
        # Of the provider library it admits Google's grant and the provider fake for its tests, and not the consents,
        # which only the setups' list admits. Of the credential code it admits the sealing half, with which its tests
        # open what the setups sealed, so no code of the UI but its client-secret package, which the list below governs,
        # links code that opens a value (ADR-0081, ADR-0107). Its non-test code is held tighter by ui-outside-setup.
        ui:
          list-mode: strict
          files:
          - "${base-path}/ui/**.go"
          - "!${base-path}/ui/app/**"
          - "!${base-path}/ui/internal/setup/**"
          allow:
          - "$gostd"
          # The contract generator's document types. The generator is test code, and non-test-code refuses it.
          - "github.com/getkin/kin-openapi/openapi3$"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/google/go-cmp/cmp/cmpopts$"
          # The driver, its types and its pool, each exact, as the database list names its pool, and its error
          # type, which tells the setups' refusals by the constraint they name.
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/pgconn$"
          - "github.com/jackc/pgx/v5/pgtype$"
          - "github.com/jackc/pgx/v5/pgxpool$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          # The sealing half, with which the tests open what the setups sealed and write the key pair they load.
          - "github.com/ppat/mediated-mailbox-mcp/credential/seal$"
          # The data-access subsections the read API's statements sit in, from ui/internal/registry,
          # ui/internal/reads and ui/internal/policymanagement. Of account_state and rate_state only the parent
          # subsections, so the UI's code reaches no statement that touches a credential or the limiter's writes
          # (ADR-0143).
          - "github.com/ppat/mediated-mailbox-mcp/db/accounts$"
          - "github.com/ppat/mediated-mailbox-mcp/db/accountstate$"
          - "github.com/ppat/mediated-mailbox-mcp/db/auditlog$"
          - "github.com/ppat/mediated-mailbox-mcp/db/jobruns$"
          - "github.com/ppat/mediated-mailbox-mcp/db/maskingevents$"
          - "github.com/ppat/mediated-mailbox-mcp/db/messages$"
          - "github.com/ppat/mediated-mailbox-mcp/db/policycandidates$"
          # Policy management's statements, in ui/internal/policymanagement and ui/internal/registry. The history, the
          # composed policy the screens classify senders against, the account's own rules and their writes,
          # the base policy's statements, which run only in a base-policy transaction (ADR-0112), and the
          # reads of the senders the counts, Home's restricted messages and the sender picker classify.
          - "github.com/ppat/mediated-mailbox-mcp/db/policychanges$"
          - "github.com/ppat/mediated-mailbox-mcp/db/policyrules/base$"
          - "github.com/ppat/mediated-mailbox-mcp/db/policyrules/manage$"
          - "github.com/ppat/mediated-mailbox-mcp/db/ratestate$"
          # The op log's row count the jobs endpoint shows beside an applied plan's rollback, in
          # ui/internal/reads/jobs.go.
          - "github.com/ppat/mediated-mailbox-mcp/db/reorgoplog$"
          - "github.com/ppat/mediated-mailbox-mcp/db/reorgplans$"
          - "github.com/ppat/mediated-mailbox-mcp/db/scangatedecisions$"
          - "github.com/ppat/mediated-mailbox-mcp/db/senders/classification$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"
          # The process, which hands each endpoint's Build its capabilities and keeps the UI's checks in a slot of
          # its own, the lookups the read API classifies senders with (ADR-0136), and the pool the read API's Build
          # gets with its readiness report, in ui/internal/api, ui/internal/pages and ui/internal/server (ADR-0142).
          - "github.com/ppat/mediated-mailbox-mcp/process$"
          - "github.com/ppat/mediated-mailbox-mcp/process/database$"
          - "github.com/ppat/mediated-mailbox-mcp/process/domains$"
          # The provider fake, which the setups' tests run over. The list for non-test code refuses it.
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail/fake$"
          # Google's grant, whose consent the setups' tests read.
          - "github.com/ppat/mediated-mailbox-mcp/provider/google$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/crash$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/fixture$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/"
          # The marker text the UI's integration tests seed into message-derived fields (ADR-0044).
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/marker$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/property$"
          # The read latency and stream subscriber metrics, in ui/internal/reads (ADR-0076).
          - "github.com/prometheus/client_golang/prometheus$"
          - "github.com/prometheus/client_golang/prometheus/promhttp$"
          # The policy file's YAML form, read and written by the policy import and export in
          # ui/internal/policymanagement (ADR-0004, ADR-0110), the module the configuration library already reads YAML
          # with.
          - "go.yaml.in/yaml/v3$"
          # The sender classifier's domain functions, which the read API's Build passes policy management to
          # match senders against rules with (ADR-0004).
          - "golang.org/x/net/idna$"
          - "golang.org/x/net/publicsuffix$"
          - "pgregory.net/rapid$"

        # The UI's setup, ui/internal/setup without its client-secret package, every file: the OAuth client setup,
        # connecting an account, and account settings (ADR-0084). It is the one list of the UI that admits each
        # provider's consent by name, provider/consent, and the setups build Gmail's consent from it and keep it. It
        # admits the sealing half, with which the setups load the public key and seal a client's secret and an
        # account's credential, and not the opening half, credential/open, nor the read of a client's sealed secret,
        # db/oauthclients, so the setups reach a stored secret only through the client-secret package's one operation
        # (ADR-0081, ADR-0143). It names the UI's packages it uses exactly, so it admits neither the reads nor policy
        # management.
        ui-setup:
          list-mode: strict
          files:
          - "${base-path}/ui/internal/setup/**.go"
          - "!${base-path}/ui/internal/setup/clientsecret/**"
          allow:
          - "$gostd"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/pgtype$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/credential/seal$"
          # The accounts listing, account setup's writes and reads, the code exchange's authentication attempt,
          # recorded by the latest-wins statement the deployables share, and the rate state account settings read
          # (ADR-0084, ADR-0097, ADR-0143).
          - "github.com/ppat/mediated-mailbox-mcp/db/accounts$"
          - "github.com/ppat/mediated-mailbox-mcp/db/accounts/setup$"
          - "github.com/ppat/mediated-mailbox-mcp/db/accountstate$"
          # The OAuth client setup's statements, which read no secret.
          - "github.com/ppat/mediated-mailbox-mcp/db/oauthclients/setup$"
          - "github.com/ppat/mediated-mailbox-mcp/db/ratestate$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"
          # The process, which hands the setups' Build its capabilities, and the pool it gets (ADR-0142).
          - "github.com/ppat/mediated-mailbox-mcp/process$"
          - "github.com/ppat/mediated-mailbox-mcp/process/database$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/consent$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/core/refusal$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/core/schema$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/core/setup$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/paths$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/registry$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/server$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/setup/clientsecret$"

        # The UI's non-test code outside its setup, every package but ui/internal/setup and its client-secret package,
        # its entry included. It names this project's packages exactly, the pure core apart, and admits neither the
        # consents, provider/consent, nor the sealing half, credential/seal, nor the client-secret package, so no read
        # or policy handler reaches the key credentials are sealed to, a consent or a stored secret, which the setups
        # build and keep (ADR-0081, ADR-0084). It admits ui/internal/setup, whose routes the read API endpoint mounts.
        ui-outside-setup:
          list-mode: strict
          files:
          - "${base-path}/ui/**.go"
          - "!${base-path}/ui/internal/setup/**"
          - "!$test"
          allow:
          - "$gostd"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/pgconn$"
          - "github.com/jackc/pgx/v5/pgtype$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/db/accounts$"
          - "github.com/ppat/mediated-mailbox-mcp/db/accountstate$"
          - "github.com/ppat/mediated-mailbox-mcp/db/auditlog$"
          - "github.com/ppat/mediated-mailbox-mcp/db/jobruns$"
          - "github.com/ppat/mediated-mailbox-mcp/db/maskingevents$"
          - "github.com/ppat/mediated-mailbox-mcp/db/messages$"
          - "github.com/ppat/mediated-mailbox-mcp/db/policycandidates$"
          - "github.com/ppat/mediated-mailbox-mcp/db/policychanges$"
          - "github.com/ppat/mediated-mailbox-mcp/db/policyrules/base$"
          - "github.com/ppat/mediated-mailbox-mcp/db/policyrules/manage$"
          - "github.com/ppat/mediated-mailbox-mcp/db/ratestate$"
          - "github.com/ppat/mediated-mailbox-mcp/db/reorgoplog$"
          - "github.com/ppat/mediated-mailbox-mcp/db/reorgplans$"
          - "github.com/ppat/mediated-mailbox-mcp/db/scangatedecisions$"
          - "github.com/ppat/mediated-mailbox-mcp/db/senders/classification$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"
          - "github.com/ppat/mediated-mailbox-mcp/process$"
          - "github.com/ppat/mediated-mailbox-mcp/process/database$"
          - "github.com/ppat/mediated-mailbox-mcp/process/domains$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/app$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/browser$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/api$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/core/attention$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/core/lens$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/core/reads$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/core/refusal$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/core/rules$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/core/schema$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/pages$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/paths$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/policymanagement$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/reads$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/registry$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/server$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/setup$"
          - "github.com/prometheus/client_golang/prometheus$"
          - "go.yaml.in/yaml/v3$"
          - "golang.org/x/net/idna$"
          - "golang.org/x/net/publicsuffix$"

        # The UI's entry, every file, which holds its spec and nothing else (ADR-0142). The spec names each endpoint's
        # Build, so it admits the read API's package and the pages' package, and the UI's paths the endpoints' patterns
        # are written from. It admits no data-access subsection, not the checks of ui/internal/server and not the
        # client-secret opener, which only the setups reach. Its tests run the spec through the process,
        # write a key pair the UI seals to, render the chart, and run the UI against a test database, one of whose
        # schemas the chain db/migrations embeds refuses.
        ui-app:
          list-mode: strict
          files:
          - "${base-path}/ui/app/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/ppat/mediated-mailbox-mcp/core/config$"
          - "github.com/ppat/mediated-mailbox-mcp/credential/seal$"
          - "github.com/ppat/mediated-mailbox-mcp/db/migrations$"
          - "github.com/ppat/mediated-mailbox-mcp/process$"
          - "github.com/ppat/mediated-mailbox-mcp/process/settings$"
          - "github.com/ppat/mediated-mailbox-mcp/process/version$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/helmchart$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/app$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/api$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/pages$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/paths$"

        # The one part of the UI that opens a stored value, an OAuth client's secret for a consent's code exchange,
        # and nothing else (ADR-0081). It alone admits the credential code's opening half and the read of a
        # client's sealed secret, which the UI's other lists refuse everywhere else in the component, ui/internal/setup
        # included.
        ui-clientsecret:
          list-mode: strict
          files:
          - "${base-path}/ui/internal/setup/clientsecret/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/ppat/mediated-mailbox-mcp/db/oauthclients$"
          - "github.com/ppat/mediated-mailbox-mcp/credential/open$"
          - "github.com/ppat/mediated-mailbox-mcp/credential/seal$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/setup/clientsecret$"

        # The UI's shipped code outside its one opening part links none of the standard library's public-key code, so
        # it opens no stored value by hand (ADR-0081). It names the cryptography packages that code uses, each exact,
        # and admits the rest of the standard library and the modules the ui list admits, which that list confines.
        # Under the sorted-neighbour comparison of ADR-0071 the exact crypto entries stop the crypto entry $gostd adds
        # from admitting any other package under crypto/, crypto/hpke, crypto/mlkem and crypto/ecdh among them, while
        # the root crypto package, interfaces and the hash registry, stays admitted. Test files
        # are outside it, because the server's tests open what the setups sealed to check it, and a test is never
        # served.
        ui-shipped-crypto:
          list-mode: strict
          files:
          - "${base-path}/ui/**.go"
          - "!${base-path}/ui/internal/setup/clientsecret/**"
          - "!$test"
          allow:
          - "$gostd"
          # The request token's and the consent attempt's keys and seal, and the server's TLS.
          - "crypto/aes$"
          - "crypto/cipher$"
          - "crypto/hkdf$"
          - "crypto/hmac$"
          - "crypto/rand$"
          - "crypto/sha256$"
          - "crypto/tls$"
          - "github.com/getkin/kin-openapi/"
          - "github.com/google/go-cmp/"
          - "github.com/jackc/pgx/v5"
          - "github.com/ppat/mediated-mailbox-mcp/"
          - "github.com/prometheus/client_golang/"
          - "go.yaml.in/yaml/v3$"
          - "golang.org/x/net/idna$"
          - "golang.org/x/net/publicsuffix$"
          - "pgregory.net/rapid"

        # Deployable worker, its non-test code outside its job kinds' code and the index writes and run records they
        # share, which each have a list of their own: its entry, which holds its spec, and the series its job kinds
        # share. A deployable imports its own code and the shared libraries, never another
        # deployable (ADR-0054). Its entry lists the job kinds and builds nothing, so it names no data-access
        # subsection, not the Session, the connections, the rate limiter or the body conversion, which each job kind
        # reaches through its own list (ADR-0117, ADR-0142, ADR-0143).
        worker:
          list-mode: strict
          files:
          - "${base-path}/worker/**.go"
          - "!$test"
          - "!${base-path}/worker/internal/backfill/**"
          - "!${base-path}/worker/internal/deltasync/**"
          - "!${base-path}/worker/internal/index/**"
          - "!${base-path}/worker/internal/runs/**"
          allow:
          - "$gostd"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/process$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/"
          - "github.com/prometheus/client_golang/prometheus$"

        # Deployable worker, its test files outside its job kinds' code and the code they share that has a list of
        # its own. They run the worker through its spec over the
        # provider fake, which they hand the connections through the one option the connections export for a test
        # (ADR-0142), and use the test tooling the list for non-test code refuses.
        worker-tests:
          list-mode: strict
          files:
          - "${base-path}/worker/**_test.go"
          - "!${base-path}/worker/internal/backfill/**"
          - "!${base-path}/worker/internal/deltasync/**"
          - "!${base-path}/worker/internal/index/**"
          - "!${base-path}/worker/internal/runs/**"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/credential/seal$"
          - "github.com/ppat/mediated-mailbox-mcp/process$"
          - "github.com/ppat/mediated-mailbox-mcp/process/connections$"
          - "github.com/ppat/mediated-mailbox-mcp/process/scanner$"
          - "github.com/ppat/mediated-mailbox-mcp/process/schedule$"
          - "github.com/ppat/mediated-mailbox-mcp/process/settings$"
          - "github.com/ppat/mediated-mailbox-mcp/process/version$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail/fake$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/helmchart$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/marker$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/"

        # Backfill's job kind in the worker, its shell code and its pure core. A job kind imports its own code, the
        # worker's shared code and the shared libraries, never another job kind's code (ADR-0117). It names each
        # data-access subsection it may use, which db/check tests against the application user's grants, and which holds
        # its code to its own statements (ADR-0143). The two passes' writes sit in subsections the readers' lists do not
        # admit, which backfill shares with delta sync apart from the completion flags, and the progress and the restart
        # mark are read in db/accountstate and its completion subsection (ADR-0066). It takes its pool, the Session, the
        # connections and the scanner from the process family, and calls the provider through a caller of its own and a
        # unit of work, whose end writes a rotated credential back and records the last authentication attempt, so it
        # names no adapter, no rate limiter and no opening code (ADR-0097, ADR-0142).
        worker-backfill:
          list-mode: strict
          files:
          - "${base-path}/worker/internal/backfill/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/google/go-cmp/cmp/cmpopts$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/db/accountstate$"
          - "github.com/ppat/mediated-mailbox-mcp/db/accountstate/completion$"
          - "github.com/ppat/mediated-mailbox-mcp/db/jobruns/record$"
          - "github.com/ppat/mediated-mailbox-mcp/db/maskingevents/record$"
          - "github.com/ppat/mediated-mailbox-mcp/db/messages/ingest$"
          - "github.com/ppat/mediated-mailbox-mcp/db/messages/scan$"
          - "github.com/ppat/mediated-mailbox-mcp/db/scangatedecisions/record$"
          - "github.com/ppat/mediated-mailbox-mcp/db/senders/statistics$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"
          - "github.com/ppat/mediated-mailbox-mcp/process$"
          - "github.com/ppat/mediated-mailbox-mcp/process/connections$"
          - "github.com/ppat/mediated-mailbox-mcp/process/database$"
          - "github.com/ppat/mediated-mailbox-mcp/process/scanner$"
          - "github.com/ppat/mediated-mailbox-mcp/process/sessions$"
          - "github.com/ppat/mediated-mailbox-mcp/provider$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail/fake$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/crash$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/fixture$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/marker$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/property$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/backfill/"
          # The index writes, the gate-and-scan loop and the run records both job kinds share, each with its
          # pure core (ADR-0117).
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/index$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/index/core$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/runs$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/runs/core$"
          - "github.com/ppat/mediated-mailbox-mcp/process/schedule$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/series$"
          - "github.com/prometheus/client_golang/prometheus$"
          # The sender classifier's domain functions, which the job kind passes pass 1.
          - "golang.org/x/net/idna$"
          - "golang.org/x/net/publicsuffix$"
          - "pgregory.net/rapid$"

        # Delta sync's job kind in the worker, its shell code and its pure core. A job kind imports its own code, the
        # worker's shared code and the shared libraries, never another job kind's code (ADR-0117). It names each
        # data-access subsection it may use, which db/check tests against the application user's grants, and which holds
        # its code to its own statements (ADR-0143). A tick adds and masks mail and records its runs as backfill's first
        # pass does, and decides and scans what waits as its second pass does, through the subsections it shares with
        # backfill. The change cursor and a change's labels, flags and removals sit in subsections only this list
        # admits. The account's progress is read in db/accountstate (ADR-0066, ADR-0104). It takes its pool, the
        # Session, the connections and the scanner from the process family, calls the provider through a caller of its
        # own and a unit of work, and re-seals through the connections, so it names no adapter, no rate limiter, no
        # opening code and no write of a client secret (ADR-0092, ADR-0097, ADR-0142).
        worker-sync:
          list-mode: strict
          files:
          - "${base-path}/worker/internal/deltasync/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/google/go-cmp/cmp/cmpopts$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/db/accountstate$"
          - "github.com/ppat/mediated-mailbox-mcp/db/accountstate/cursor$"
          - "github.com/ppat/mediated-mailbox-mcp/db/jobruns/record$"
          - "github.com/ppat/mediated-mailbox-mcp/db/maskingevents/record$"
          - "github.com/ppat/mediated-mailbox-mcp/db/messages/change$"
          - "github.com/ppat/mediated-mailbox-mcp/db/messages/ingest$"
          - "github.com/ppat/mediated-mailbox-mcp/db/messages/scan$"
          - "github.com/ppat/mediated-mailbox-mcp/db/scangatedecisions/record$"
          - "github.com/ppat/mediated-mailbox-mcp/db/senders/statistics$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/alertingrules$"
          # Its tests seal the credentials they store.
          - "github.com/ppat/mediated-mailbox-mcp/credential/seal$"
          - "github.com/ppat/mediated-mailbox-mcp/process$"
          - "github.com/ppat/mediated-mailbox-mcp/process/connections$"
          - "github.com/ppat/mediated-mailbox-mcp/process/database$"
          - "github.com/ppat/mediated-mailbox-mcp/process/scanner$"
          - "github.com/ppat/mediated-mailbox-mcp/process/sessions$"
          - "github.com/ppat/mediated-mailbox-mcp/provider$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail/fake$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/crash$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/fixture$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/marker$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/property$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/deltasync/"
          # The index writes, the gate-and-scan loop and the run records both job kinds share, each with its
          # pure core (ADR-0117).
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/index$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/index/core$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/runs$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/runs/core$"
          - "github.com/ppat/mediated-mailbox-mcp/process/schedule$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/series$"
          - "github.com/prometheus/client_golang/prometheus$"
          # The sender classifier's domain functions, which the job kind passes a tick.
          - "golang.org/x/net/idna$"
          - "golang.org/x/net/publicsuffix$"
          - "pgregory.net/rapid$"

        # The worker's index writes, every file: a message added with its masking events, the gate's decision on a
        # waiting message with what it leads to, the delisting transition's enactment, the gate-and-scan loop with its
        # render-and-scan step, and their pure core, which both job kinds share (ADR-0117). It writes in the
        # transaction a job kind opened, through the subsections it names, which db/check tests against the application
        # user's grants and which both job kinds' lists name too, and reaches no job kind's code (ADR-0143). It converts
        # a body's HTML as release does (ADR-0104, ADR-0036).
        worker-index:
          list-mode: strict
          files:
          - "${base-path}/worker/internal/index/**.go"
          allow:
          - "$gostd"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/pgtype$"
          - "github.com/ppat/mediated-mailbox-mcp/content/markdown$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/db/maskingevents/record$"
          - "github.com/ppat/mediated-mailbox-mcp/db/messages/ingest$"
          - "github.com/ppat/mediated-mailbox-mcp/db/messages/scan$"
          - "github.com/ppat/mediated-mailbox-mcp/db/scangatedecisions/record$"
          - "github.com/ppat/mediated-mailbox-mcp/db/senders/statistics$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"
          - "github.com/ppat/mediated-mailbox-mcp/process/scanner$"

        # The worker's run records, every file: the recording of a run, its events and failed items, and the read of a
        # job's latest recorded success, with the runs' pure core, which both job kinds share (ADR-0016, ADR-0117). It
        # writes in the transaction a job kind opened, through the one subsection it names, and reaches no job kind's
        # code (ADR-0143).
        worker-runs:
          list-mode: strict
          files:
          - "${base-path}/worker/internal/runs/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/pgtype$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/db/jobruns/record$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/runs/core$"

        # The API server's API root reaches the service layer and nothing below it (ADR-0030). Each root is generated
        # from the operation registry by one file, its generator, and only the generator imports the library its
        # protocol is served with, so an operation cannot be registered on a root anywhere else (ADR-0053). The
        # other files of a root import no standard-library package at all.
        api-api-root:
          list-mode: strict
          files:
          - "${base-path}/api/internal/api/**.go"
          - "!${base-path}/api/internal/api/api.go"
          - "!$test"
          allow:
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/api$"
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/api/"
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/service$"

        # Every package of the API server but the two roots serves no HTTP, so none can register an operation on the
        # client surface outside the roots' generators (ADR-0053). A new package under internal falls under it
        # without being named. It admits the standard-library packages and the pure cores these packages import,
        # the shared one and the API server's own, pgx and its pgtype, the transaction helper, the data-access
        # subsections the service layer's operations run, the service layer and the body operation's provider
        # functions, and, for the registry's build and those functions, the process family's packages they get, the
        # provider library's calling side, its mail port and its rate limiter, the body conversion and the metrics
        # library, and nothing under net/http. A package added here that imports anything else adds its entry with
        # it.
        api-no-http:
          list-mode: strict
          files:
          - "${base-path}/api/internal/**.go"
          - "!${base-path}/api/internal/api/**"
          - "!${base-path}/api/internal/mcp/**"
          - "!${base-path}/api/internal/bearer/**"
          - "!$test"
          allow:
          - "bytes$"
          - "context$"
          - "encoding/json$"
          - "errors$"
          - "fmt$"
          # The level a failed call is logged at, which the service layer decides once for both roots (ADR-0122).
          - "log/slog$"
          - "regexp$"
          - "slices$"
          - "strconv$"
          - "strings$"
          - "sync$"
          - "sync/atomic$"
          - "time$"
          - "encoding/base64$"
          - "unicode$"
          - "unicode/utf8$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/pgtype$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          # The release step, which the body operation runs (ADR-0036).
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/core/"
          # The service layer and the body operation's provider functions, which the registry's build builds the
          # operations from.
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/bodies$"
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/service$"
          # The operations' statements, each run through the transaction helper (ADR-0047), the body operation's
          # audit row among them.
          - "github.com/ppat/mediated-mailbox-mcp/db/accountstate$"
          - "github.com/ppat/mediated-mailbox-mcp/db/auditlog/record$"
          - "github.com/ppat/mediated-mailbox-mcp/db/jobruns$"
          - "github.com/ppat/mediated-mailbox-mcp/db/maskingevents$"
          - "github.com/ppat/mediated-mailbox-mcp/db/messages$"
          - "github.com/ppat/mediated-mailbox-mcp/db/ratestate$"
          - "github.com/ppat/mediated-mailbox-mcp/db/senders$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"
          # The process, its Session, its pool, its scanner and its connections, and the provider library's calling
          # side and rate limiter, which the body operation's provider functions and the registry's build reach, each
          # held to its one package by the API server's own lists (ADR-0142).
          - "github.com/ppat/mediated-mailbox-mcp/process$"
          - "github.com/ppat/mediated-mailbox-mcp/process/connections$"
          - "github.com/ppat/mediated-mailbox-mcp/process/database$"
          - "github.com/ppat/mediated-mailbox-mcp/process/scanner$"
          - "github.com/ppat/mediated-mailbox-mcp/process/sessions$"
          - "github.com/ppat/mediated-mailbox-mcp/provider$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/ratelimit$"
          # The body conversion and the series the registry's build registers (ADR-0036, ADR-0125).
          - "github.com/ppat/mediated-mailbox-mcp/content/markdown$"
          - "github.com/ppat/mediated-mailbox-mcp/content/markdown/core$"
          - "github.com/prometheus/client_golang/prometheus$"

        # The API root's generator, which serves HTTP.
        api-api-generator:
          list-mode: strict
          files:
          - "${base-path}/api/internal/api/api.go"
          allow:
          - "$gostd"
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/bearer$"
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/registry$"
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/service$"
          - "github.com/ppat/mediated-mailbox-mcp/core/config$"
          - "github.com/ppat/mediated-mailbox-mcp/process$"

        # The API server's MCP root reaches the service layer and nothing below it (ADR-0030), under the same rule
        # as the API root.
        api-mcp-root:
          list-mode: strict
          files:
          - "${base-path}/api/internal/mcp/**.go"
          - "!${base-path}/api/internal/mcp/mcp.go"
          - "!$test"
          allow:
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/mcp$"
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/mcp/"
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/service$"

        # The MCP root's generator, the one file of the API server the MCP SDK is admitted in (ADR-0086).
        api-mcp-generator:
          list-mode: strict
          files:
          - "${base-path}/api/internal/mcp/mcp.go"
          allow:
          - "$gostd"
          - "github.com/modelcontextprotocol/go-sdk/jsonrpc$"
          - "github.com/modelcontextprotocol/go-sdk/mcp$"
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/bearer$"
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/registry$"
          - "github.com/ppat/mediated-mailbox-mcp/api/internal/service$"
          - "github.com/ppat/mediated-mailbox-mcp/core/config$"
          - "github.com/ppat/mediated-mailbox-mcp/process$"
          - "github.com/ppat/mediated-mailbox-mcp/process/version$"

        # Every non-test file outside test tooling. Test tooling, the provider fake, the contract suite, rapid and
        # go-cmp never reach code that ships.
        non-test-code:
          list-mode: strict
          files:
          - "$all"
          - "!$test"
          - "!${base-path}/testsupport/**"
          - "!${base-path}/provider/mail/fake/**"
          - "!${base-path}/provider/mail/contract/**"
          allow:
          - "$gostd"
          - "github.com/JohannesKaufmann/html-to-markdown/v2/"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/"
          - "github.com/modelcontextprotocol/go-sdk/jsonrpc$"
          - "github.com/modelcontextprotocol/go-sdk/mcp$"
          - "github.com/ppat/mediated-mailbox-mcp/cli/"
          - "github.com/ppat/mediated-mailbox-mcp/content/"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/db/"
          - "github.com/ppat/mediated-mailbox-mcp/credential/open$"
          - "github.com/ppat/mediated-mailbox-mcp/credential/seal$"
          - "github.com/ppat/mediated-mailbox-mcp/api/"
          - "github.com/ppat/mediated-mailbox-mcp/migrator/"
          - "github.com/ppat/mediated-mailbox-mcp/process$"
          - "github.com/ppat/mediated-mailbox-mcp/process/accounts$"
          - "github.com/ppat/mediated-mailbox-mcp/process/connections$"
          - "github.com/ppat/mediated-mailbox-mcp/process/database$"
          - "github.com/ppat/mediated-mailbox-mcp/process/database/core$"
          - "github.com/ppat/mediated-mailbox-mcp/process/domains$"
          - "github.com/ppat/mediated-mailbox-mcp/process/logging$"
          - "github.com/ppat/mediated-mailbox-mcp/process/policies$"
          - "github.com/ppat/mediated-mailbox-mcp/process/scanner$"
          - "github.com/ppat/mediated-mailbox-mcp/process/schedule$"
          - "github.com/ppat/mediated-mailbox-mcp/process/sessions$"
          - "github.com/ppat/mediated-mailbox-mcp/process/settings$"
          - "github.com/ppat/mediated-mailbox-mcp/process/version$"
          - "github.com/ppat/mediated-mailbox-mcp/provider$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/calendar/caldav$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/calendar/google$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/consent$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/internal/adapters$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail/gmail$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/google$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail/gmail/core$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/mail/jmap$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/ratelimit$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/ratelimit/core$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/"
          - "github.com/ppat/mediated-mailbox-mcp/worker/"
          - "github.com/prometheus/client_golang/prometheus$"
          - "github.com/prometheus/client_golang/prometheus/collectors$"
          - "github.com/prometheus/client_golang/prometheus/promhttp$"
          # The migration runner, which db/migrate's own list confines to that package (ADR-0139).
          - "github.com/pressly/goose/v3$"
          - "github.com/pressly/goose/v3/lock$"
          # The configuration library's decoder (ADR-0078).
          - "go.yaml.in/yaml/v3$"
          # Restores the standard library under go/, which the entry above hides (see the notes at the top).
          - "go/"
          - "golang.org/x/net/html$"
          - "golang.org/x/net/html/atom$"
          # The sender classifier's domain functions, which the policies and the UI's endpoints prepare each policy
          # with.
          - "golang.org/x/net/idna$"
          - "golang.org/x/net/publicsuffix$"
          # The Gmail adapter's decoding of a part held apart in its declared charset (ADR-0134).
