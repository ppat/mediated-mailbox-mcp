          - "github.com/ppat/mediated-mailbox-mcp/worker/"
          - "github.com/prometheus/client_golang/prometheus$"
          - "github.com/prometheus/client_model/go$"
          - "github.com/wasilibs/go-pgquery$"
          - "go.yaml.in/yaml/v3$"
          # Restores the standard library under go/, which the entry above hides (see the notes at the top).
          - "go/"
          - "golang.org/x/net/idna$"
          - "golang.org/x/net/publicsuffix$"
          # The charset label table the Gmail adapter passes to its body decision, which the decision's tests pass
          # it too (ADR-0134).
          - "golang.org/x/text/encoding/htmlindex$"
          - "google.golang.org/protobuf/reflect/protoreflect$"

        # Every Go file outside all components and outside every package of a family that has a list of its own, such
        # as a new top-level directory or a new package of a family not yet given lists. It admits only the standard
        # library, so such a file is checked rather than unchecked.
        residual:
          list-mode: strict
          files:
          - "$all"
          - "!${base-path}/cli/**"
          - "!${base-path}/content/**"
          - "!${base-path}/core/**"
          - "!${base-path}/credential/seal/**"
          - "!${base-path}/credential/open/**"
          - "!${base-path}/db/**"
          - "!${base-path}/api/**"
          - "!${base-path}/migrator/**"
          - "!${base-path}/packaging/**"
          - "!${base-path}/process/*.go"
          - "!${base-path}/process/accounts/**"
          - "!${base-path}/process/connections/**"
          - "!${base-path}/process/database/**"
          - "!${base-path}/process/domains/**"
          - "!${base-path}/process/logging/**"
          - "!${base-path}/process/policies/**"
          - "!${base-path}/process/scanner/**"
          - "!${base-path}/process/schedule/**"
          - "!${base-path}/process/sessions/**"
          - "!${base-path}/process/settings/**"
          - "!${base-path}/process/version/**"
          - "!${base-path}/provider/**"
          - "!${base-path}/testsupport/**"
          - "!${base-path}/ui/**"
          - "!${base-path}/worker/**"
          allow:
          - "$gostd"
