---
# The one golangci-lint configuration for every Go file in the repository (ADR-0071).
#
# Several settings below restate a default or pick a non-default because the ordinary spelling fails open,
# meaning a rule reads correctly and silently checks nothing. banproof (testsupport/cmd/banproof) runs this
# file unchanged against the checked-in violation files and fails when a rule stops reporting.
version: "2"

run:
  # Files carrying these build tags are linted. Without a tag listed here, depguard and forbidigo skip every
  # file that needs it. banproof adds its own tag on the command line, which golangci-lint appends to these.
  # devloop compiles ui/internal/devloop/on.go, the one file the UI's dev loop adds.
  build-tags:
  - integration
  - gmail_live
  - devloop

issues:
  # The defaults hide a second finding on a line and cap repeated findings, which would drop a finding
  # banproof requires, such as one import refused by two lists.
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

formatters:
  enable:
  - gofumpt
  - goimports
  settings:
    gofumpt:
      module-path: github.com/ppat/mediated-mailbox-mcp
    goimports:
      local-prefixes:
      - github.com/ppat/mediated-mailbox-mcp

linters:
  default: none
  enable:
  # Linters standing in for controls. Each is proven by violation files, and nothing may suppress its findings.
  - depguard
  - errcheck
  - exhaustive
  - forbidigo
  # Ordinary linters. banproof's list of ordinary linters names exactly these, and only they may be named by a
  # //nolint directive or an exclusion rule. A linter that comes to carry a control leaves both lists.
  - bodyclose
  - errorlint
  - gosec
  - govet
  - ineffassign
  - misspell
  - revive
  - staticcheck
  - unused

  exclusions:
    # The default excludes every finding in a file whose header says it is generated, so a hand-written
    # header would switch off every rule in that file.
    generated: disable
    presets: []
    rules:
    # A violation file breaks a control on purpose and banproof requires exactly its wanted findings, so the
    # ordinary linters' opinions of it are not reported.
    - path: _violation(_[a-z]+)?(_test)?\.go$
      linters: [bodyclose, errorlint, gosec, govet, ineffassign, misspell, revive, staticcheck, unused]
    # Test code and the test tooling under testsupport run the commands and read the files that the repository
    # or their caller names, and none of that code reaches a shipped binary (the non-test-code import list).
    - path: (_test\.go$|^testsupport/)
      linters: [gosec]
      text: '^G(204|304):'

  settings:
    gosec:
      config:
        global:
          # gosec otherwise honours its own #nosec comment, which needs no reason. A false positive is
          # suppressed with //nolint:gosec and a reason instead, the one form banproof checks.
          nosec: true

    revive:
      # revive otherwise honours its own disable comment with no reason given.
      directives:
      - name: specify-disable-reason
        severity: error
      # Rules that staticcheck's default checks leave out. Listing any rule switches revive's defaults off.
      rules:
      - name: blank-imports
      - name: context-as-argument
      - name: dot-imports
      - name: error-return
      - name: exported
      - name: package-comments
      - name: receiver-naming
      - name: redefines-builtin-id
      - name: time-naming
      - name: unexported-return
      - name: unreachable-code
      - name: var-naming

    errcheck:
      check-blank: true
      check-type-assertions: true

    exhaustive:
      # Its default, written out. The deny-defaulting default branch every verdict switch carries would
      # otherwise silence the check.
      default-signifies-exhaustive: false

    forbidigo:
      # With type analysis off, a pattern carrying pkg matches nothing, and an aliased import escapes.
      analyze-types: true
      # The default skips Example functions in test files.
      exclude-godoc-examples: false
      forbid:
      - pattern: ^rapid\.(Make|MakeCustom)$
        pkg: ^pgregory\.net/rapid$
        msg: generators build values through exported constructors inside rapid.Custom (ADR-0069)
      - pattern: ^cmpopts\.IgnoreUnexported$
        pkg: ^github\.com/google/go-cmp/cmp/cmpopts$
        msg: it reports no difference between values that differ in unexported fields (ADR-0070)
      # The package-level default registry, the helpers that use it, and the constructors that register into it.
      # Each process builds its own registry and passes it where metrics are registered (ADR-0076).
      - pattern: ^prometheus\.(DefaultRegisterer|DefaultGatherer|MustRegister|Register|Unregister)$
        pkg: ^github\.com/prometheus/client_golang/prometheus$
        msg: a process registers its metrics on the registry it builds, never the default one (ADR-0076)
      - pattern: ^promauto\.New
        pkg: ^github\.com/prometheus/client_golang/prometheus/promauto$
        msg: promauto's constructors without a registry register into the default one (ADR-0076)
      - pattern: ^promhttp\.Handler$
        pkg: ^github\.com/prometheus/client_golang/prometheus/promhttp$
        msg: it serves the default registry, and a process serves its own through promhttp.HandlerFor (ADR-0076)
      # The process's default loggers and the built-in print functions. Every Go file logs through a logger it was
      # handed. main.go makes its logger the default only for code the project does not own, so the setters stay
      # allowed (ADR-0122).
      - pattern: ^slog\.(Default|Debug|DebugContext|Info|InfoContext|Warn|WarnContext|Error|ErrorContext|Log|LogAttrs)$
        pkg: ^log/slog$
        msg: code logs through the logger it was handed, never the process default (ADR-0122)
      - pattern: ^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln|Output|Default|Writer)$
        pkg: ^log$
        msg: code logs through the logger it was handed, never the process default (ADR-0122)
      - pattern: ^(print|println)$
        msg: a built-in print writes plain text to standard error, outside the handed logger (ADR-0122)

    depguard:
      # How to read these lists.
      #
      # - Every list is strict, so an import is refused unless an allow entry admits it. No list has a deny entry.
      # - A file matched by several lists must satisfy all of them. A file matched by none is not checked, so
      #   the residual list at the end catches files outside every component.
      # - Allow entries are string prefixes. An entry ending in $ is exact. Standard-library entries in the
      #   pure-core lists are exact, because a prefix os would also admit os/exec. Project entries end in / or $.
      # - depguard checks only one sorted neighbour per import, so an exact entry must not sit under a shorter
      #   prefix entry of the same path, or the prefix stops admitting its other subpackages.
      # - File globs match absolute paths. Every project glob starts with ${base-path}, the directory of this
      #   file, so a parent directory of the checkout with the same name cannot match. dir/**.go matches files
      #   directly in dir, and dir/**/*.go does not.
      # - $gostd admits every standard-library package through one entry per top-level name, such as go. An entry
      #   for a module whose path starts with go. sorts between go and go/ast and hides every go/ package, so a
      #   list holding such an entry also lists go/.
      rules:

        # Non-test files of every pure-core package, in any component, matched by a path element named core at any
        # depth (ADR-0040, ADR-0071). Every entry outside this project meets ADR-0071's four conditions for a pure
        # core's imports, together with everything it imports.
        pure-core:
          list-mode: strict
          files:
          - "${base-path}/core/**.go"
          - "${base-path}/**/core/**.go"
          - "!$test"
          allow:
          - "bytes$"
          - "cmp$"
          - "errors$"
          - "iter$"
          - "maps$"
          - "math$"
          - "math/bits$"
          - "regexp$"
          - "slices$"
          - "sort$"
          - "strconv$"
          - "strings$"
          - "unicode$"
          - "unicode/utf8$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/mediate/internal/core/"
          - "github.com/ppat/mediated-mailbox-mcp/ratelimit/core/"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/core/"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/core/"

        # Test files of every pure-core package. What the non-test files may import, plus test tooling and the
        # functions a shell passes in.
        pure-core-tests:
          list-mode: strict
          files:
          - "${base-path}/core/**_test.go"
          - "${base-path}/**/core/**_test.go"
          allow:
          - "bytes$"
          - "cmp$"
          - "errors$"
          - "iter$"
          - "maps$"
          - "math$"
          - "math/bits$"
          - "regexp$"
          - "slices$"
          - "sort$"
          - "strconv$"
          - "strings$"
          - "unicode$"
          - "unicode/utf8$"
          - "testing$"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/google/go-cmp/cmp/cmpopts$"
          # The punycode decoding and the public-suffix list a shell passes to the sender classifier, so its tests run
          # against the real lookups. Neither is pure, so neither is on the pure-core list for non-test files.
          - "golang.org/x/net/idna$"
          - "golang.org/x/net/publicsuffix$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/mediate/internal/core/"
          # The rate limiter's pure core is one package rather than a directory of packages, so its external tests
          # import it by its exact path.
          - "github.com/ppat/mediated-mailbox-mcp/ratelimit/core$"
          - "github.com/ppat/mediated-mailbox-mcp/ratelimit/core/"
          # The database connection's and the credential code's pure cores are one package each too.
          - "github.com/ppat/mediated-mailbox-mcp/executioncontext/credential/core$"
          - "github.com/ppat/mediated-mailbox-mcp/process/dbconnect/core$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/fixture$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/marker$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/property$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/core/"
          - "github.com/ppat/mediated-mailbox-mcp/worker/internal/core/"
          - "pgregory.net/rapid$"

        # The account snapshot, every file, a package of the execution context family. It is a library, so it
        # connects as no role of its own. db/check plans the statements of the subsections it names under the role of
        # each deployable or job kind whose list admits it (ADR-0066, ADR-0118).
        accountload:
          list-mode: strict
          files:
          - "${base-path}/executioncontext/accountload/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/"
          - "github.com/ppat/mediated-mailbox-mcp/db/accounts$"
          - "github.com/ppat/mediated-mailbox-mcp/db/accountstate/credential$"
          - "github.com/ppat/mediated-mailbox-mcp/db/oauthclients$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"
          - "github.com/ppat/mediated-mailbox-mcp/executioncontext/accountload$"
          - "github.com/ppat/mediated-mailbox-mcp/executioncontext/credential/open$"
          - "github.com/ppat/mediated-mailbox-mcp/executioncontext/credential/seal$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"

        # The account session, every file, a package of the execution context family. It holds an account's provider
        # connection over the account snapshot and records the latest authentication attempt, under the role of each
        # deployable or job kind whose list admits it. It imports no provider adapter and no rate limiter, since each
        # composition root passes it a connector per provider and leases inside each call (ADR-0089, ADR-0097).
        session:
          list-mode: strict
          files:
          - "${base-path}/executioncontext/session/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/pgtype$"
          # Its tests' pool, keys and database, under the role of a job kind that holds sources.
          - "github.com/jackc/pgx/v5/pgxpool$"
          - "github.com/ppat/mediated-mailbox-mcp/core/mail$"
          - "github.com/ppat/mediated-mailbox-mcp/db/accountstate/authentication$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"
          - "github.com/ppat/mediated-mailbox-mcp/executioncontext/accountload$"
          - "github.com/ppat/mediated-mailbox-mcp/executioncontext/credential/open$"
          - "github.com/ppat/mediated-mailbox-mcp/executioncontext/credential/seal$"
          - "github.com/ppat/mediated-mailbox-mcp/executioncontext/session$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"

        # The sealed credentials, every file, packages of the execution context family.
        credential:
          list-mode: strict
          files:
          - "${base-path}/executioncontext/credential/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/ppat/mediated-mailbox-mcp/executioncontext/credential/"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"

        # The database connection, every file, a package of the process family. It builds the connection a
        # deployable's database section describes, and connects as no role of its own.
        dbconnect:
          list-mode: strict
          files:
          - "${base-path}/process/dbconnect/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/jackc/pgx/v5/pgxpool$"
          - "github.com/ppat/mediated-mailbox-mcp/process/dbconnect$"
          - "github.com/ppat/mediated-mailbox-mcp/process/dbconnect/core$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"

        # The database measurements, every file, a package of the process family. It traces the statements a
        # connection runs and reads a pool's statistics, on the registerer a composition root passes in, and runs no
        # statement of its own. Its tests run statements through the transaction helper against the test database
        # (ADR-0125).
        dbmetrics:
          list-mode: strict
          files:
          - "${base-path}/process/dbmetrics/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/pgxpool$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"
          - "github.com/ppat/mediated-mailbox-mcp/process/dbmetrics$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          - "github.com/prometheus/client_golang/prometheus$"

        # The probe and metrics listener, every file, a package of the process family. client_golang is admitted for
        # the registry it serves (ADR-0051, ADR-0076).
        probes:
          list-mode: strict
          files:
          - "${base-path}/process/probes/**.go"
          allow:
          - "$gostd"
          - "github.com/ppat/mediated-mailbox-mcp/process/logging$"
          - "github.com/prometheus/client_golang/prometheus$"
          - "github.com/prometheus/client_golang/prometheus/promhttp$"

        # The logger, every file, a package of the process family. It builds a logger over the standard library
        # alone and its tests compare through the shared options value (ADR-0122, ADR-0070).
        logging:
          list-mode: strict
          files:
          - "${base-path}/process/logging/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/ppat/mediated-mailbox-mcp/process/logging$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"

        # The data-access library, every file.
        db:
          list-mode: strict
          files:
          - "${base-path}/db/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/google/go-cmp/cmp/cmpopts$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/"
          - "github.com/pganalyze/pg_query_go/v6$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/db/"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/crash$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/fixture$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/property$"
          - "github.com/wasilibs/go-pgquery$"
          - "go.yaml.in/yaml/v3$"
          # Restores the standard library under go/, which the entry above hides (see the notes at the top).
          - "go/"
          - "google.golang.org/protobuf/reflect/protoreflect$"
          - "pgregory.net/rapid$"

        # The policy loader, every file, a package of the execution context family. It is a library, so it connects
        # as no role of its own. db/check plans the statements of the subsection it names under the role of each
        # deployable or job kind whose list admits it (ADR-0066, ADR-0118). client_golang is admitted for the
        # reload-failure series (ADR-0076, ADR-0077).
        policyload:
          list-mode: strict
          files:
          - "${base-path}/executioncontext/policyload/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/"
          - "github.com/ppat/mediated-mailbox-mcp/core/policy$"
          - "github.com/ppat/mediated-mailbox-mcp/db/policyrules$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"
          - "github.com/ppat/mediated-mailbox-mcp/executioncontext/policyload$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          - "github.com/prometheus/client_golang/prometheus$"

        # The provider adapter library, every file. client_golang is admitted for the count of provider request cost an
        # adapter keeps where it sends each request (ADR-0076, ADR-0077).
        provider:
          list-mode: strict
          files:
          - "${base-path}/provider/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/google/go-cmp/cmp/cmpopts$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/provider/"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/fixture$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/livecontract$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/marker$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/property$"
          - "github.com/prometheus/client_golang/prometheus$"
          - "pgregory.net/rapid$"

        # Non-test files of the provider fake and the contract suite, which only tests use. The list for
        # non-test code excludes them, so this list keeps rapid out of them.
        provider-test-code:
          list-mode: strict
          files:
          - "${base-path}/provider/fake/**.go"
          - "${base-path}/provider/contract/**.go"
          - "!$test"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/provider/"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/fixture$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/marker$"

        # The rate limiter, every file. Its pure rules under ratelimit/core also meet the pure-core lists. It is a
        # library, so it connects as no role of its own. db/check plans the statements of the subsections it names
        # under the role of each deployable or job kind whose list admits it (ADR-0066, ADR-0118).
        ratelimit:
          list-mode: strict
          files:
          - "${base-path}/ratelimit/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/google/go-cmp/cmp/cmpopts$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/db/ratestate/limiter$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/fake$"
          - "github.com/ppat/mediated-mailbox-mcp/ratelimit/"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/crash$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/fixture$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/property$"
          - "github.com/prometheus/client_golang/prometheus$"
          - "github.com/prometheus/client_model/go$"
          - "go.yaml.in/yaml/v3$"
          - "pgregory.net/rapid$"

        # The message content family, every file. It is the one place the HTML-to-Markdown converter and the HTML
        # parser it reads are admitted, and the CommonMark parser is admitted for its tests, which read the output as a
        # Markdown reader would.
        content:
          list-mode: strict
          files:
          - "${base-path}/content/**.go"
          allow:
          - "$gostd"
          - "github.com/JohannesKaufmann/html-to-markdown/v2/"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/google/go-cmp/cmp/cmpopts$"
          - "github.com/ppat/mediated-mailbox-mcp/content/"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/fixture$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/marker$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/property$"
          - "github.com/yuin/goldmark$"
          - "github.com/yuin/goldmark/"
          - "golang.org/x/net/html$"
          - "golang.org/x/net/html/atom$"
          - "pgregory.net/rapid$"

        # The message content family outside its conversion package. The converter is called from content/markdown
        # alone, so the mediator and the Backfill Job convert with one configuration.
        content-without-converter:
          list-mode: strict
          files:
          - "${base-path}/content/**.go"
          - "!${base-path}/content/markdown/**"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/google/go-cmp/cmp/cmpopts$"
          - "github.com/ppat/mediated-mailbox-mcp/content/"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/fixture$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/property$"
          - "pgregory.net/rapid$"

        # The configuration library, every file, a package of the process family. The YAML decoder is the one module
        # it adds (ADR-0078).
        settings:
          list-mode: strict
          files:
          - "${base-path}/process/settings/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/ppat/mediated-mailbox-mcp/process/settings$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
