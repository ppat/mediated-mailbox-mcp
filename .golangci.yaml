          # The metrics endpoint the composition root serves (ADR-0051, ADR-0103).
          - "github.com/prometheus/client_golang/prometheus/promhttp$"
          # The sender classifier's domain functions, which the composition root passes a tick.
          - "golang.org/x/net/idna$"
          - "golang.org/x/net/publicsuffix$"
          - "pgregory.net/rapid$"

        # Deployable ui, every file. A deployable imports its own code and the shared libraries, never another
        # deployable (ADR-0054). Its tests may also use test tooling, which the list for non-test code refuses.
        # It names each data-access subsection it may use, which db/check tests against its role's grants.
        # It admits neither the provider adapters nor the rate limiter, because the UI holds no provider credential,
        # cannot reach a mailbox and does not spend the rate budget (ADR-0038, ADR-0021, ADR-0025). Of the provider
        # library it admits Gmail's consent alone, which holds no Provider Port code, and the provider fake for its
        # tests. Of the credential library it admits the sealing half alone, so no code of the UI but its client-secret
        # package, which the list below governs, links code that opens a value (ADR-0081, ADR-0107).
        ui:
          list-mode: strict
          files:
          - "${base-path}/ui/**.go"
          - "!${base-path}/ui/internal/clientsecret/**"
          allow:
          - "$gostd"
          # The contract generator's document types. The generator is test code, and non-test-code refuses it.
          - "github.com/getkin/kin-openapi/openapi3$"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/google/go-cmp/cmp/cmpopts$"
          # The driver, its types and its pool, each exact, as the dbconnect list names its pool, and its error
          # type, which tells the setups' refusals by the constraint they name.
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/pgconn$"
          - "github.com/jackc/pgx/v5/pgtype$"
          - "github.com/jackc/pgx/v5/pgxpool$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          # The sealing half, with which the setups seal a client's secret and an account's credential.
          - "github.com/ppat/mediated-mailbox-mcp/credential/seal$"
          # The data-access subsections the read API's statements sit in, from ui/internal/registry and
          # ui/internal/api. Of account_state and rate_state only the parent subsections, so the UI's role is never
          # planned against a statement that touches a credential or the limiter's writes.
          - "github.com/ppat/mediated-mailbox-mcp/db/accounts$"
          # The account setup's writes and reads, and the code exchange's authentication attempt, recorded by the
          # latest-wins statement the deployables share (ADR-0084, ADR-0097), in ui/internal/api.
          - "github.com/ppat/mediated-mailbox-mcp/db/accounts/setup$"
          - "github.com/ppat/mediated-mailbox-mcp/db/accountstate$"
          - "github.com/ppat/mediated-mailbox-mcp/db/accountstate/authentication$"
          - "github.com/ppat/mediated-mailbox-mcp/db/auditlog$"
          - "github.com/ppat/mediated-mailbox-mcp/db/jobruns$"
          - "github.com/ppat/mediated-mailbox-mcp/db/jobruns/classification$"
          - "github.com/ppat/mediated-mailbox-mcp/db/maskingevents$"
          # The masking events counted under their message's sender, which Home's masking card reads, in
          # ui/internal/api/attention.go.
          - "github.com/ppat/mediated-mailbox-mcp/db/maskingevents/senders$"
          - "github.com/ppat/mediated-mailbox-mcp/db/messages$"
          - "github.com/ppat/mediated-mailbox-mcp/db/messages/classification$"
          # The OAuth client setup's statements, which read no secret, in ui/internal/api.
          - "github.com/ppat/mediated-mailbox-mcp/db/oauthclients/setup$"
          - "github.com/ppat/mediated-mailbox-mcp/db/policycandidates$"
          # Policy management's statements, in ui/internal/api and ui/internal/registry. The history, the
          # composed policy the screens classify senders against, the account's own rules and their writes,
          # the base policy's statements, which run only in a base-policy transaction (ADR-0112), and the
          # reads of the stored sender class the counts and the sender picker make.
          - "github.com/ppat/mediated-mailbox-mcp/db/policychanges$"
          - "github.com/ppat/mediated-mailbox-mcp/db/policyrules/base$"
          - "github.com/ppat/mediated-mailbox-mcp/db/policyrules/manage$"
          - "github.com/ppat/mediated-mailbox-mcp/db/ratestate$"
          # The op log's row count the jobs endpoint shows beside an applied plan's rollback, in
          # ui/internal/api/jobs.go.
          - "github.com/ppat/mediated-mailbox-mcp/db/reorgoplog$"
          - "github.com/ppat/mediated-mailbox-mcp/db/reorgplans$"
          - "github.com/ppat/mediated-mailbox-mcp/db/scangatedecisions$"
          - "github.com/ppat/mediated-mailbox-mcp/db/senders/classification$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"
          # The composition root's configuration (ADR-0078) and its database section, in ui/main.go.
          - "github.com/ppat/mediated-mailbox-mcp/dbconnect$"
          - "github.com/ppat/mediated-mailbox-mcp/dbconnect/core$"
          # The provider fake, which the setups' tests run over. The list for non-test code refuses it.
          - "github.com/ppat/mediated-mailbox-mcp/provider/fake$"
          # Gmail's consent, which the composition root hands the server.
          - "github.com/ppat/mediated-mailbox-mcp/provider/gmail/consent$"
          - "github.com/ppat/mediated-mailbox-mcp/settings$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/crash$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/fixture$"
          # The marker text the UI's integration tests seed into message-derived fields (ADR-0044).
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/marker$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/property$"
          # The read latency and stream subscriber metrics and the metrics endpoint, in ui/internal/api (ADR-0076).
          - "github.com/prometheus/client_golang/prometheus$"
          - "github.com/prometheus/client_golang/prometheus/promhttp$"
          # The policy file's YAML form, read and written by the policy import and export in ui/internal/api
          # (ADR-0004, ADR-0110), the module the configuration library already reads YAML with.
          - "go.yaml.in/yaml/v3$"
          # The sender classifier's domain functions, which the composition root passes policy management to
          # match senders against rules with (ADR-0004).
          - "golang.org/x/net/idna$"
          - "golang.org/x/net/publicsuffix$"
          - "pgregory.net/rapid$"

        # The one part of the UI that opens a stored value, an OAuth client's secret for a consent's code exchange,
        # and nothing else (ADR-0081). It alone admits the credential library's opening half and the read of a
        # client's sealed secret, which the UI's list refuses everywhere else in the component.
        ui-clientsecret:
          list-mode: strict
          files:
          - "${base-path}/ui/internal/clientsecret/**.go"
          allow:
          - "$gostd"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/ppat/mediated-mailbox-mcp/credential/open$"
          - "github.com/ppat/mediated-mailbox-mcp/credential/seal$"
          - "github.com/ppat/mediated-mailbox-mcp/db/oauthclients$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/internal/clientsecret$"

        # The UI's shipped code outside its one opening part links none of the standard library's public-key code, so
        # it opens no stored value by hand (ADR-0081). It names the cryptography packages that code uses, each exact,
        # and admits the rest of the standard library and the modules the ui list admits, which that list confines.
        # Under the sorted-neighbour comparison of ADR-0071 the exact crypto entries stop the crypto entry $gostd adds
        # from admitting any other package under crypto/, crypto/hpke, crypto/mlkem and crypto/ecdh among them, while
        # the root crypto package, interfaces and the hash registry, stays admitted. Test files
        # are outside it, because the server's tests open what the setups sealed to check it, and a test is never
        # served.
        ui-shipped-crypto:
          list-mode: strict
          files:
          - "${base-path}/ui/**.go"
          - "!${base-path}/ui/internal/clientsecret/**"
          - "!$test"
          allow:
          - "$gostd"
          # The request token's and the consent attempt's keys and seal, and the server's TLS.
          - "crypto/aes$"
          - "crypto/cipher$"
          - "crypto/hkdf$"
          - "crypto/hmac$"
          - "crypto/rand$"
          - "crypto/sha256$"
          - "crypto/tls$"
          - "github.com/getkin/kin-openapi/"
          - "github.com/google/go-cmp/"
          - "github.com/jackc/pgx/v5"
          - "github.com/ppat/mediated-mailbox-mcp/"
          - "github.com/prometheus/client_golang/"
          - "go.yaml.in/yaml/v3$"
          - "golang.org/x/net/idna$"
          - "golang.org/x/net/publicsuffix$"
          - "pgregory.net/rapid"

        # The mediator's API root reaches the service layer and nothing below it (ADR-0030). Each root is generated
        # from the operation registry by one file, its generator, and only the generator imports the library its
        # protocol is served with, so an operation cannot be registered on a root anywhere else (ADR-0053). The
        # other files of a root import no standard-library package at all.
        mediate-api-root:
          list-mode: strict
          files:
          - "${base-path}/mediate/internal/api/**.go"
          - "!${base-path}/mediate/internal/api/api.go"
          - "!$test"
          allow:
          - "github.com/ppat/mediated-mailbox-mcp/mediate/internal/api$"
          - "github.com/ppat/mediated-mailbox-mcp/mediate/internal/api/"
          - "github.com/ppat/mediated-mailbox-mcp/mediate/internal/service$"

        # Every package of the mediator but the two roots serves no HTTP, so none can register an operation on the
        # client surface outside the roots' generators (ADR-0053). A new package under internal falls under it
        # without being named. It admits the standard-library packages and the pure cores these packages import,
        # the shared one and the mediator's own, pgx and its pgtype, the transaction helper, and the data-access
        # subsections the service layer's operations run, and nothing under net/http. A package added here that
        # imports anything else adds its entry with it.
        mediate-no-http:
          list-mode: strict
          files:
          - "${base-path}/mediate/internal/**.go"
          - "!${base-path}/mediate/internal/api/**"
          - "!${base-path}/mediate/internal/mcp/**"
          - "!$test"
          allow:
          - "bytes$"
          - "context$"
          - "encoding/json$"
          - "errors$"
          - "fmt$"
          - "regexp$"
          - "slices$"
          - "strconv$"
          - "strings$"
          - "sync$"
          - "sync/atomic$"
          - "time$"
          - "encoding/base64$"
          - "unicode$"
          - "unicode/utf8$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/pgtype$"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          # The release step, which the body operation runs (ADR-0036).
          - "github.com/ppat/mediated-mailbox-mcp/mediate/internal/core/"
          # The operations' statements, each run through the transaction helper (ADR-0047), the body operation's
          # audit row among them.
          - "github.com/ppat/mediated-mailbox-mcp/db/accountstate$"
          - "github.com/ppat/mediated-mailbox-mcp/db/auditlog/record$"
          - "github.com/ppat/mediated-mailbox-mcp/db/jobruns$"
          - "github.com/ppat/mediated-mailbox-mcp/db/maskingevents$"
          - "github.com/ppat/mediated-mailbox-mcp/db/messages$"
          - "github.com/ppat/mediated-mailbox-mcp/db/ratestate$"
          - "github.com/ppat/mediated-mailbox-mcp/db/senders$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"

        # The API root's generator, which serves HTTP.
        mediate-api-generator:
          list-mode: strict
          files:
          - "${base-path}/mediate/internal/api/api.go"
          allow:
          - "$gostd"
          - "github.com/ppat/mediated-mailbox-mcp/mediate/internal/service$"

        # The mediator's MCP root reaches the service layer and nothing below it (ADR-0030), under the same rule
        # as the API root.
        mediate-mcp-root:
          list-mode: strict
          files:
          - "${base-path}/mediate/internal/mcp/**.go"
          - "!${base-path}/mediate/internal/mcp/mcp.go"
          - "!$test"
          allow:
          - "github.com/ppat/mediated-mailbox-mcp/mediate/internal/mcp$"
          - "github.com/ppat/mediated-mailbox-mcp/mediate/internal/mcp/"
          - "github.com/ppat/mediated-mailbox-mcp/mediate/internal/service$"

        # The MCP root's generator, the one file of the mediator the MCP SDK is admitted in (ADR-0086).
        mediate-mcp-generator:
          list-mode: strict
          files:
          - "${base-path}/mediate/internal/mcp/mcp.go"
          allow:
          - "$gostd"
          - "github.com/modelcontextprotocol/go-sdk/jsonrpc$"
          - "github.com/modelcontextprotocol/go-sdk/mcp$"
          - "github.com/ppat/mediated-mailbox-mcp/mediate/internal/service$"

        # Every non-test file outside test tooling. Test tooling, the provider fake, the contract suite, rapid and
        # go-cmp never reach code that ships.
        non-test-code:
          list-mode: strict
          files:
          - "$all"
          - "!$test"
          - "!${base-path}/testsupport/**"
          - "!${base-path}/provider/fake/**"
          - "!${base-path}/provider/contract/**"
          allow:
          - "$gostd"
          - "github.com/ppat/mediated-mailbox-mcp/accountload$"
          - "github.com/JohannesKaufmann/html-to-markdown/v2/"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/"
          - "github.com/modelcontextprotocol/go-sdk/jsonrpc$"
          - "github.com/modelcontextprotocol/go-sdk/mcp$"
          - "github.com/ppat/mediated-mailbox-mcp/backfill/"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/credential/core$"
          - "github.com/ppat/mediated-mailbox-mcp/credential/open$"
          - "github.com/ppat/mediated-mailbox-mcp/credential/seal$"
          - "github.com/ppat/mediated-mailbox-mcp/db/"
          - "github.com/ppat/mediated-mailbox-mcp/dbconnect$"
          - "github.com/ppat/mediated-mailbox-mcp/dbconnect/core$"
          - "github.com/ppat/mediated-mailbox-mcp/mediate/"
          - "github.com/ppat/mediated-mailbox-mcp/organize/"
          - "github.com/ppat/mediated-mailbox-mcp/policyload$"
          - "github.com/ppat/mediated-mailbox-mcp/propose/"
          - "github.com/ppat/mediated-mailbox-mcp/provider/caldav$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/gcal$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/gmail$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/gmail/consent$"
          - "github.com/ppat/mediated-mailbox-mcp/provider/jmap$"
          - "github.com/ppat/mediated-mailbox-mcp/ratelimit/"
          - "github.com/ppat/mediated-mailbox-mcp/sanitize/"
          - "github.com/ppat/mediated-mailbox-mcp/settings$"
          - "github.com/ppat/mediated-mailbox-mcp/sync/"
          - "github.com/ppat/mediated-mailbox-mcp/ui/"
          - "github.com/prometheus/client_golang/prometheus$"
          - "github.com/prometheus/client_golang/prometheus/promhttp$"
          # The configuration library's decoder (ADR-0078).
          - "go.yaml.in/yaml/v3$"
          # Restores the standard library under go/, which the entry above hides (see the notes at the top).
          - "go/"
          - "golang.org/x/net/html$"
          - "golang.org/x/net/html/atom$"
          # The sender classifier's domain functions, which the mediator's composition root passes it.
          - "golang.org/x/net/idna$"
          - "golang.org/x/net/publicsuffix$"

        # Every test file outside the shared test tooling that is not a property test or a crash sequence. rapid
        # and its test support stay out of these (ADR-0069). The shared test tooling's own tests meet its two lists
        # instead, and only those lists admit golang.org/x/tools.
        ordinary-tests:
          list-mode: strict
          files:
          - "$test"
          - "!**_property_test.go"
          - "!**_crash_test.go"
          - "!${base-path}/testsupport/**"
          allow:
          - "$gostd"
          - "github.com/getkin/kin-openapi/openapi3$"
          - "github.com/google/go-cmp/cmp$"
          - "github.com/google/go-cmp/cmp/cmpopts$"
          - "github.com/jackc/pgx/v5$"
          - "github.com/jackc/pgx/v5/"
          - "github.com/pganalyze/pg_query_go/v6$"
          - "github.com/ppat/mediated-mailbox-mcp/accountload$"
          - "github.com/ppat/mediated-mailbox-mcp/backfill/"
          - "github.com/ppat/mediated-mailbox-mcp/core/"
          - "github.com/ppat/mediated-mailbox-mcp/credential/core$"
          - "github.com/ppat/mediated-mailbox-mcp/credential/open$"
          - "github.com/ppat/mediated-mailbox-mcp/credential/seal$"
          - "github.com/ppat/mediated-mailbox-mcp/db/"
          - "github.com/ppat/mediated-mailbox-mcp/dbconnect$"
          - "github.com/ppat/mediated-mailbox-mcp/dbconnect/core$"
          - "github.com/ppat/mediated-mailbox-mcp/mediate/"
          - "github.com/ppat/mediated-mailbox-mcp/organize/"
          - "github.com/ppat/mediated-mailbox-mcp/policyload$"
          - "github.com/ppat/mediated-mailbox-mcp/propose/"
          - "github.com/ppat/mediated-mailbox-mcp/provider/"
          - "github.com/ppat/mediated-mailbox-mcp/ratelimit/"
          - "github.com/ppat/mediated-mailbox-mcp/sanitize/"
          - "github.com/ppat/mediated-mailbox-mcp/settings$"
          - "github.com/ppat/mediated-mailbox-mcp/sync/"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/compare$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/fixture$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/livecontract$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/marker$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/mustnotcompile$"
          - "github.com/ppat/mediated-mailbox-mcp/testsupport/postgres$"
          - "github.com/ppat/mediated-mailbox-mcp/ui/"
          - "github.com/prometheus/client_golang/prometheus$"
          - "github.com/prometheus/client_model/go$"
          - "github.com/wasilibs/go-pgquery$"
          - "go.yaml.in/yaml/v3$"
          # Restores the standard library under go/, which the entry above hides (see the notes at the top).
          - "go/"
          - "golang.org/x/net/idna$"
          - "golang.org/x/net/publicsuffix$"
          - "google.golang.org/protobuf/reflect/protoreflect$"

        # Every Go file outside all components, such as a new top-level directory not yet given lists. It
        # admits only the standard library, so such a file is checked rather than unchecked.
        residual:
          list-mode: strict
          files:
          - "$all"
          - "!${base-path}/accountload/**"
          - "!${base-path}/backfill/**"
          - "!${base-path}/core/**"
          - "!${base-path}/credential/**"
          - "!${base-path}/db/**"
