          - "github.com/ppat/mediated-mailbox-mcp/credential/seal$"
          # A tick's statements. It adds and masks mail and records its runs as backfill's first pass does,
          # decides and scans what waits as its second pass does, and records the last authentication
          # attempt, through the subsections it shares with backfill. The change cursor, a change's labels,
          # flags and removals, and the re-seal of a client secret sit in subsections only this list admits.
          # The account's progress and lowered target are read in db/accountstate (ADR-0075, ADR-0066,
          # ADR-0104, ADR-0092).
          - "github.com/ppat/mediated-mailbox-mcp/db/accountstate$"
          - "github.com/ppat/mediated-mailbox-mcp/db/accountstate/authentication$"
          - "github.com/ppat/mediated-mailbox-mcp/db/accountstate/cursor$"
          - "github.com/ppat/mediated-mailbox-mcp/db/jobruns/record$"
