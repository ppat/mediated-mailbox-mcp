        # Deployable mediate, every file. A deployable imports its own code and the shared libraries, never another
        # deployable (ADR-0054). Its tests may also use test tooling, which the list for non-test code refuses.
        # It names each data-access subsection it may use, which db/check tests against its role's grants.
        # The MCP root's generator is left out, because it alone imports the MCP SDK, and its own list governs it.
        mediate:
          list-mode: strict
          files:
          - "${base-path}/mediate/**.go"
          - "!${base-path}/mediate/internal/mcp/mcp.go"
          allow:
