        # each data-access subsection it may use, which db/check tests against delta sync's role's grants. A tick
        # adds and masks mail and records its runs as backfill's first pass does, and decides and scans what waits
        # as its second pass does, through the subsections it shares with backfill. The change cursor, a change's
