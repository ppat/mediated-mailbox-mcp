---
# yamllint disable rule:line-length
name: chart

on:
  pull_request:
    paths:
    - .github/workflows/chart.yaml
    - mise.lock
    - mise.toml
    - packaging/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@dabb7c51177ba40ea15235f18d0c1f2dee4b0c9f # v3.1.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    # --strict fails on warnings as well as errors. The values schema refuses a render without the chart's required
    # values, so the lint reads the file that sets each of them.
    - name: Lint the chart
      shell: bash
      working-directory: ./current
      run: mise exec -- helm lint --strict packaging/chart --values packaging/chart/ci/required-values.yaml
