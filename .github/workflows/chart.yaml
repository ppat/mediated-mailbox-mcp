---
# yamllint disable rule:line-length
name: chart

on:
  pull_request:
    paths:
    - .github/workflows/chart.yaml
    - mise.lock
    - mise.toml
    - packaging/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@d21b387fa6a35e48f78985a1e636ec728866981e # v2.8.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    # --strict fails on warnings as well as errors. The chart refuses to render without its required inputs, and a
    # render that stops there lints none of the templates after it, so the lint names each required input.
    - name: Lint the chart
      shell: bash
      working-directory: ./current
      # yamllint disable-line rule:indentation
      run: |
        mise exec -- helm lint --strict packaging/chart \
          --set database.host=postgres --set database.name=mailbox --set keys.secretName=keys \
          --set migrate.passwordFileSecret.name=migrate --set mediate.passwordSecret.name=mediate \
          --set mediate.tokenSecret.name=token --set mediate.tls.secretName=mediate-tls \
          --set backfill.passwordSecret.name=backfill --set sync.passwordSecret.name=sync \
          --set ui.passwordSecret.name=ui --set ui.tls.secretName=ui-tls
