---
# yamllint disable rule:line-length
name: chainsaw

# The chainsaw suite deploys the chart onto an ephemeral kind cluster through flux, with the images already
# published for one release version, and builds no image (ADR-0052). Every release runs it, called by the release
# workflow with the release's version, so the suite and the check of the release's key-generation binary run against
# each release with no one starting them (ADR-0088). A dispatch names a version. A pull request changing the chart,
# the suite or this workflow tests the pull request's chart with the latest release's images, so a pull request that
# changes only a deployable does not run it.
on:
  pull_request:
    paths:
    - .github/scripts/chainsaw/**
    - .github/workflows/chainsaw.yaml
    - packaging/**
  workflow_call:
    inputs:
      version:
        description: Release version whose published images the chart is deployed with, such as 0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version whose published images the chart is deployed with, such as 0.1.0
        required: true
        type: string

# A literal prefix, because a called workflow's github.workflow is its caller's, and sharing the caller's group
# would cancel one against the other.
concurrency:
  group: chainsaw-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGES: backfill mediate migrate organize propose sync ui

jobs:
  # The check that a run tested something, proven on every run of this workflow, a run with no release to deploy
  # included, against the pinned chainsaw's own output for a suite with no test and for one with a test.
  self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@d21b387fa6a35e48f78985a1e636ec728866981e # v2.8.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Prove the check refuses a run that tested nothing
      shell: bash
      working-directory: ./current
      run: .github/scripts/chainsaw/self-test.sh packaging/tests/chainsaw/.chainsaw.yaml

  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      ready: ${{ steps.resolve.outputs.ready }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
    # A version given by a dispatch or by the release workflow without every image fails. On a pull request, no
    # release, or a latest release without every image, skips the suite with a warning and a summary saying why,
    # since nothing exists to deploy the chart with. Once a release publishes its images, every such pull request
    # runs the suite.
    - name: Resolve the version and find its images
      id: resolve
      shell: bash
      env:
        ACTOR: ${{ github.actor }}
        GH_TOKEN: ${{ github.token }}
        INPUT_VERSION: ${{ inputs.version }}
        OWNER: ${{ github.repository_owner }}
        REPOSITORY: ${{ github.repository }}
      # yamllint disable-line rule:indentation
      run: |
        not_ready() {
          if [[ -n "$INPUT_VERSION" ]]; then
            echo "::error::$1"
            exit 1
          fi
          echo "::warning::$1 The chainsaw suite did not run."
          printf '### The chainsaw suite did not run\n\n%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          echo "ready=false" >> "$GITHUB_OUTPUT"
          exit 0
        }

        if [[ -n "$INPUT_VERSION" ]]; then
          version="${INPUT_VERSION#v}"
        else
          if ! latest="$(gh api "repos/${REPOSITORY}/releases/latest" --jq .tag_name 2>&1)"; then
            [[ "$latest" == *"HTTP 404"* ]] || { echo "::error::Reading the latest release failed: $latest"; exit 1; }
            not_ready "${REPOSITORY} has no release, so no version has published images to deploy the chart with."
          fi
          version="${latest#v}"
        fi
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || not_ready "'${version}' is not a release version."

        gh auth token | docker login ghcr.io --username "$ACTOR" --password-stdin
        missing=()
        for image in $IMAGES; do
          ref="ghcr.io/${OWNER,,}/mediated-mailbox-${image}:${version}"
          docker manifest inspect "$ref" > /dev/null || missing+=("$ref")
        done
        docker logout ghcr.io
        (( ${#missing[@]} == 0 )) || not_ready "Version ${version} has no published ${missing[*]}."

        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "ready=true" >> "$GITHUB_OUTPUT"

  chainsaw:
    needs: [resolve]
    if: ${{ needs.resolve.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@d21b387fa6a35e48f78985a1e636ec728866981e # v2.8.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    # The images are pulled with the job's token and loaded into the cluster's node, so the cluster needs no
    # registry credentials while the packages are private.
    - name: Create the cluster and load the version's images
      shell: bash
      working-directory: ./current
      env:
        ACTOR: ${{ github.actor }}
        OWNER: ${{ github.repository_owner }}
        REGISTRY_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.resolve.outputs.version }}
      # yamllint disable-line rule:indentation
      run: |
        mise exec -- kind create cluster --name chainsaw --wait 120s
        echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
        for image in $IMAGES; do
          ref="ghcr.io/${OWNER,,}/mediated-mailbox-${image}:${VERSION}"
          docker pull "$ref"
          mise exec -- kind load docker-image --name chainsaw "$ref"
        done
        docker logout ghcr.io

    # Flux is harness machinery here, not something the chart assumes. The repository is private, so flux clones
    # it with the job's token, which lives as long as the job.
    - name: Install flux and its clone credentials
      shell: bash
      working-directory: ./current
      env:
        GIT_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
      # yamllint disable-line rule:indentation
      run: |
        mise exec -- flux install
        mise exec -- flux create secret git mediated-mailbox-git --namespace flux-system \
          --url "https://github.com/${REPOSITORY}" --username x-access-token --password "$GIT_TOKEN"

    # chainsaw exits zero when it finds no test, so a run that passed no test fails here, by the check the
    # self-test job proves.
    - name: Run the suite
      shell: bash
      working-directory: ./current
      env:
        OWNER: ${{ github.repository_owner }}
        REPOSITORY: ${{ github.repository }}
        REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        VERSION: ${{ needs.resolve.outputs.version }}
      # yamllint disable-line rule:indentation
      run: |
        cat > "${RUNNER_TEMP}/values.yaml" <<EOF
        version: "${VERSION}"
        registry: ghcr.io/${OWNER,,}
        chart:
          path: packaging/chart
        git:
          url: https://github.com/${REPOSITORY}
          commit: ${REVISION}
          secretName: mediated-mailbox-git
        EOF
        set -o pipefail
        mise exec -- chainsaw test packaging/tests/chainsaw --config packaging/tests/chainsaw/.chainsaw.yaml \
          --values "${RUNNER_TEMP}/values.yaml" | tee "${RUNNER_TEMP}/chainsaw.log"
        .github/scripts/chainsaw/passed.sh "${RUNNER_TEMP}/chainsaw.log"

  # The key-generation binary the release attached, checked against the release's signing identity, with a tampered
  # copy refused and the pair it writes sealed to and opened with through the library (ADR-0088). On a pull request,
  # a latest release that attached no binary skips with a warning, as the suite does without images.
  keygen:
    needs: [resolve]
    if: ${{ needs.resolve.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@d21b387fa6a35e48f78985a1e636ec728866981e # v2.8.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Check the release's key-generation binary
      shell: bash
      working-directory: ./current
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_VERSION: ${{ inputs.version }}
        REPOSITORY: ${{ github.repository }}
        VERSION: ${{ needs.resolve.outputs.version }}
      # yamllint disable-line rule:indentation
      run: |
        assets="$(gh release view "v${VERSION}" --repo "$REPOSITORY" --json assets --jq '.assets[].name')"
        if ! grep -qx 'mediated-mailbox-keygen-linux-amd64' <<< "$assets"; then
          message="Release v${VERSION} attached no key-generation binary."
          if [[ -n "$INPUT_VERSION" ]]; then
            echo "::error::${message}"
            exit 1
          fi
          echo "::warning::${message} The binary was not checked."
          printf '### The key-generation binary was not checked\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        .github/scripts/chainsaw/keygen.sh "$VERSION" "$REPOSITORY"
