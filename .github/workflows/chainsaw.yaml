---
# yamllint disable rule:line-length
name: chainsaw

# The chainsaw suite deploys the chart onto an ephemeral kind cluster through flux and exercises it (ADR-0052). A pull
# request changing the chart, the suite or this workflow runs it against the read path's images built from the pull
# request's own tree in the job and loaded into the cluster, so a pull request is proven by its own run. A dispatch
# names a release version and runs it against the images published for that version instead. A pull request that
# changes only a deployable does not run it.
on:
  pull_request:
    paths:
    - .github/scripts/chainsaw/**
    - .github/workflows/chainsaw.yaml
    - packaging/chart/**
    - packaging/tests/chainsaw/**
  workflow_dispatch:
    inputs:
      version:
        description: Release version whose published images the chart is deployed with, such as 0.1.0
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The images of the deployables the chart runs, and the migration step.
  IMAGES: migrate mediate backfill sync ui

jobs:
  # The check that a run tested something, proven on every run of this workflow against the pinned chainsaw's own
  # output for a suite with no test and for one with a test.
  self-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@d21b387fa6a35e48f78985a1e636ec728866981e # v2.8.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Prove the check refuses a run that tested nothing
      shell: bash
      working-directory: ./current
      run: .github/scripts/chainsaw/self-test.sh packaging/tests/chainsaw/.chainsaw.yaml

  chainsaw:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@d21b387fa6a35e48f78985a1e636ec728866981e # v2.8.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Create the cluster
      shell: bash
      working-directory: ./current
      run: mise exec -- kind create cluster --name chainsaw --wait 120s

    # On a pull request, each image is built from the pull request's tree with its own Dockerfile and loaded into the
    # cluster's node under a version of its own. On a dispatch, the version's published images are pulled with the
    # job's token, so the cluster needs no registry credentials while the packages are private, and a version without
    # every image fails.
    - name: Load the images
      id: images
      shell: bash
      working-directory: ./current
      env:
        ACTOR: ${{ github.actor }}
        INPUT_VERSION: ${{ inputs.version }}
        OWNER: ${{ github.repository_owner }}
        REGISTRY_TOKEN: ${{ github.token }}
      # yamllint disable-line rule:indentation
      run: |
        registry="ghcr.io/${OWNER,,}"
        if [[ -n "$INPUT_VERSION" ]]; then
          version="${INPUT_VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'${version}' is not a release version."; exit 1; }
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          for image in $IMAGES; do
            docker pull "${registry}/mediated-mailbox-${image}:${version}"
          done
          docker logout ghcr.io
        else
          version="0.0.0-ci"
          for image in $IMAGES; do
            docker build --file "${image}/Dockerfile" --tag "${registry}/mediated-mailbox-${image}:${version}" .
          done
        fi
        for image in $IMAGES; do
          mise exec -- kind load docker-image --name chainsaw "${registry}/mediated-mailbox-${image}:${version}"
        done
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "registry=${registry}" >> "$GITHUB_OUTPUT"

    # Flux is harness machinery here, not something the chart assumes. The repository is private, so flux clones
    # it with the job's token, which lives as long as the job.
    - name: Install flux and its clone credentials
      shell: bash
      working-directory: ./current
      env:
        GIT_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
      # yamllint disable-line rule:indentation
      run: |
        mise exec -- flux install
        mise exec -- flux create secret git mediated-mailbox-git --namespace flux-system \
          --url "https://github.com/${REPOSITORY}" --username x-access-token --password "$GIT_TOKEN"

    # chainsaw exits zero when it finds no test, so a run that passed no test fails here, by the check the
    # self-test job proves.
    - name: Run the suite
      shell: bash
      working-directory: ./current
      env:
        REGISTRY: ${{ steps.images.outputs.registry }}
        REPOSITORY: ${{ github.repository }}
        REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        VERSION: ${{ steps.images.outputs.version }}
      # yamllint disable-line rule:indentation
      run: |
        cat > "${RUNNER_TEMP}/values.yaml" <<EOF
        version: "${VERSION}"
        registry: ${REGISTRY}
        chart:
          path: packaging/chart
        git:
          url: https://github.com/${REPOSITORY}
          commit: ${REVISION}
          secretName: mediated-mailbox-git
        EOF
        set -o pipefail
        mise exec -- chainsaw test packaging/tests/chainsaw --config packaging/tests/chainsaw/.chainsaw.yaml \
          --values "${RUNNER_TEMP}/values.yaml" | tee "${RUNNER_TEMP}/chainsaw.log"
        .github/scripts/chainsaw/passed.sh "${RUNNER_TEMP}/chainsaw.log"
