---
# yamllint disable rule:line-length
name: chainsaw

# The chainsaw suite deploys the chart onto an ephemeral kind cluster through flux, with images already published,
# and builds no image (ADR-0052). A pull request changing the chart, the suite or this workflow tests it with main's
# latest images, which the images workflow and each release publish, so a deployable's change does not run it. A dispatch names a
# release version and tests it with that release's images.
on:
  pull_request:
    paths:
    - .github/workflows/chainsaw.yaml
    - packaging/**
  workflow_dispatch:
    inputs:
      version:
        description: Release version whose published images the chart is deployed with, such as 0.1.0
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGES: api migrator ui worker

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      ready: ${{ steps.resolve.outputs.ready }}
      tag: ${{ steps.resolve.outputs.tag }}
      images: ${{ steps.resolve.outputs.images }}
    steps:
    # Each image's tag is resolved to its digest once, here, and the run deploys exactly those four digests, so one
    # run deploys one set even when main moves during it. Each must name a commit in its revision label and the four
    # must name the same one, so a set left mixed by a failed or partial publish, or holding an image no build of
    # this repository labelled, never deploys (ADR-0049). A dispatched version without
    # every image fails. On a pull request, no latest image at all skips the suite with a warning and a summary
    # saying why, since nothing exists to deploy the chart with, and some but not all of them fails.
    - name: Resolve the images and their digests
      id: resolve
      shell: bash
      env:
        ACTOR: ${{ github.actor }}
        EVENT_NAME: ${{ github.event_name }}
        INPUT_VERSION: ${{ inputs.version }}
        REGISTRY: ghcr.io/${{ github.repository_owner }}
        REGISTRY_TOKEN: ${{ github.token }}
      # yamllint disable-line rule:indentation
      run: |
        fail() {
          echo "::error::$1"
          exit 1
        }
        if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
          tag="${INPUT_VERSION#v}"
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "'${INPUT_VERSION}' is not a release version."
        else
          tag=latest
        fi

        registry="${REGISTRY,,}"
        echo "$REGISTRY_TOKEN" | docker login "${registry%%/*}" --username "$ACTOR" --password-stdin
        missing=()
        images=()
        revisions=()
        for image in $IMAGES; do
          ref="${registry}/mediated-mailbox-${image}:${tag}"
          if ! digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            missing+=("$ref")
            continue
          fi
          revision="$(docker buildx imagetools inspect "${ref%:*}@${digest}" --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}}')"
          echo "${ref} is ${digest}, built from ${revision:-no commit it names}"
          images+=("${image}@${digest}")
          [[ -n "$revision" ]] || fail "${ref} names no commit in its revision label, so it cannot be shown to be one lockstep set with the others."
          revisions+=("${image} ${revision}")
        done
        docker logout "${registry%%/*}"

        if (( ${#missing[@]} > 0 )); then
          if [[ "$EVENT_NAME" != workflow_dispatch && ${#images[@]} -eq 0 ]]; then
            message="main has published no latest images to deploy the chart with."
            echo "::warning::${message} The chainsaw suite did not run."
            printf '### The chainsaw suite did not run\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fail "No published ${missing[*]}."
        fi
        if (( $(printf '%s\n' "${revisions[@]}" | cut -d' ' -f2 | sort -u | wc -l) != 1 )); then
          fail "The ${tag} images were built from different commits, so they are not one lockstep set: ${revisions[*]}."
        fi

        printf '### The images deployed\n\n' >> "$GITHUB_STEP_SUMMARY"
        for entry in "${images[@]}"; do
          printf -- "- \`%s/mediated-mailbox-%s\`\n" "$registry" "$entry" >> "$GITHUB_STEP_SUMMARY"
        done
        {
          echo "tag=${tag}"
          echo "images=${images[*]}"
          echo "ready=true"
        } >> "$GITHUB_OUTPUT"

  chainsaw:
    needs: [resolve]
    if: ${{ needs.resolve.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@d21b387fa6a35e48f78985a1e636ec728866981e # v2.8.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    # The images are pulled by the digests the resolve job pinned, with the job's token, tagged locally with the tag
    # the chart is given, and loaded into the cluster's node, so the cluster needs no registry credentials while the
    # packages are private.
    - name: Create the cluster and load the resolved images
      shell: bash
      working-directory: ./current
      env:
        ACTOR: ${{ github.actor }}
        IMAGE_DIGESTS: ${{ needs.resolve.outputs.images }}
        OWNER: ${{ github.repository_owner }}
        REGISTRY_TOKEN: ${{ github.token }}
        TAG: ${{ needs.resolve.outputs.tag }}
      # yamllint disable-line rule:indentation
      run: |
        mise exec -- kind create cluster --name chainsaw --wait 120s
        echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
        for entry in $IMAGE_DIGESTS; do
          repository="ghcr.io/${OWNER,,}/mediated-mailbox-${entry%@*}"
          docker pull "${repository}@${entry#*@}"
          docker tag "${repository}@${entry#*@}" "${repository}:${TAG}"
          mise exec -- kind load docker-image --name chainsaw "${repository}:${TAG}"
        done
        docker logout ghcr.io

    # Flux is harness machinery here, not something the chart assumes. The repository is private, so flux clones
    # it with the job's token, which lives as long as the job.
    - name: Install flux and its clone credentials
      shell: bash
      working-directory: ./current
      env:
        GIT_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
      # yamllint disable-line rule:indentation
      run: |
        mise exec -- flux install
        mise exec -- flux create secret git mediated-mailbox-git --namespace flux-system \
          --url "https://github.com/${REPOSITORY}" --username x-access-token --password "$GIT_TOKEN"

    # chainsaw exits zero when it finds no test, so a run that passed no test fails here.
    - name: Run the suite
      shell: bash
      working-directory: ./current
      env:
        OWNER: ${{ github.repository_owner }}
        REPOSITORY: ${{ github.repository }}
        REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        TAG: ${{ needs.resolve.outputs.tag }}
      # yamllint disable-line rule:indentation
      run: |
        cat > "${RUNNER_TEMP}/values.yaml" <<EOF
        imageTag: "${TAG}"
        registry: ghcr.io/${OWNER,,}
        chart:
          path: packaging/chart
        git:
          url: https://github.com/${REPOSITORY}
          commit: ${REVISION}
          secretName: mediated-mailbox-git
        EOF
        mise exec -- chainsaw test packaging/tests/chainsaw --config packaging/tests/chainsaw/.chainsaw.yaml \
          --values "${RUNNER_TEMP}/values.yaml" | tee "${RUNNER_TEMP}/chainsaw.log"
        passed="$(sed -n 's/^- Passed  *tests \([0-9][0-9]*\)$/\1/p' "${RUNNER_TEMP}/chainsaw.log")"
        if [[ -z "$passed" || "$passed" -eq 0 ]]; then
          echo "::error::The chainsaw suite passed no test, so the run proved nothing about the chart."
          exit 1
        fi
