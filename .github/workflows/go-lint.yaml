---
# yamllint disable rule:line-length
name: go-lint

# golangci-lint lints the whole module whenever any Go path or the lint configuration changes. A run over only
# the changed files or directories misses a finding a change causes elsewhere, such as a switch in an untouched
# package that a new enum value makes non-exhaustive.
on:
  pull_request:
    paths:
    - .github/workflows/go-lint.yaml
    - .golangci.yaml
    - '*.go'
    - '**/*.go'
    - go.mod
    - go.sum
    - mise.lock
    - mise.toml
    - backfill/**
    - core/**
    - db/**
    - mediate/**
    - organize/**
    - policyload/**
    - propose/**
    - provider/**
    - ratelimit/**
    - sanitize/**
    - sync/**
    - testsupport/**
    - ui/*.go
    - ui/internal/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@2045fb6e6cb00ab099280625b6989cf62ccc1b77 # v2.7.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    # go.mod and go.sum must hold what the module graph selects and nothing else. Every update leaves a superseded
    # go.sum entry behind, because go get never prunes, and such an entry is inert, which is why drift survives
    # green runs unnoticed. An update that shifts what the graph selects of other modules also leaves out a hash
    # those modules now need, which fails a build or govulncheck whenever one resolves them. -diff reports the
    # difference and changes no file.
    - name: Check that go.mod and go.sum are tidy
      shell: bash
      working-directory: ./current
      run: mise exec -- go mod tidy -diff

    - name: Verify the configuration
      shell: bash
      working-directory: ./current
      run: mise exec -- golangci-lint config verify

    - name: Lint the whole module
      shell: bash
      working-directory: ./current
      run: mise exec -- golangci-lint run ./...

    # The project's analysers, for ADR-0069's placement rules and ADR-0071's pure-core rule, which honour no
    # suppression comment and so run under go vet rather than inside golangci-lint. It sets the integration and
    # gmail_live tags, as .golangci.yaml does, so crash sequences and the contract run against Gmail are checked too.
    - name: Run the go vet analysers
      shell: bash
      working-directory: ./current
      run: mise exec -- go vet -tags integration,gmail_live -vettool="$(mise exec -- go tool -n vetcheck)" ./...

    - name: Prove every ban and import list still fires
      shell: bash
      working-directory: ./current
      run: mise exec -- go tool banproof
