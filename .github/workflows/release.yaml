---
# yamllint disable rule:line-length
name: release

# release-please opens and merges the release pull request and creates the release on main. Creating the
# release with the bot's App token fires the release event, and the publish jobs run on that event, from the
# release's tag. Every release builds, pushes and signs every image and the chart at the release's version,
# a documentation-only release included, because the chart's appVersion names those image tags (ADR-0049,
# ADR-0052).
on:
  pull_request:
    paths:
    - ".github/workflows/release.yaml"
    - "release-please-config.json"
  push:
    branches:
    - main
  release:
    types:
    - published
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

env:
  CHART_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  release:
    if: ${{ github.event_name != 'release' }}
    uses: ppat/github-workflows/.github/workflows/release-please.yaml@a44731e42a98c1746bbe8075fda85a28bf96eb97 # v8.4.0
    secrets:
      app_client_id: ${{ secrets.HOMELAB_BOT_APP_ID }}
      app_private_key: ${{ secrets.HOMELAB_BOT_APP_PRIVATE_KEY }}

  # The action tags each image with the release tag, its semantic version and latest, pushes it to GHCR, and signs it
  # keylessly by digest. So a release moves latest to its own commit's images, one of latest's two writers beside the
  # images workflow on main (ADR-0052).
  images:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, migrator, ui, worker]
    steps:
    - name: Checkout the release tag
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Build, push and sign the image
      uses: ppat/homelab-ops-actions/actions/build-docker-image@d21b387fa6a35e48f78985a1e636ec728866981e # v2.8.0
      with:
        image_context_path: .
        dockerfile: ${{ matrix.image }}/Dockerfile
        ghcr_repository: ${{ github.repository_owner }}/mediated-mailbox-${{ matrix.image }}
        label_title: mediated-mailbox-${{ matrix.image }}
        sign: "true"

  chart:
    needs: [images]
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
    - name: Setup the release tag and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@d21b387fa6a35e48f78985a1e636ec728866981e # v2.8.0
      with:
        current_git_ref: ${{ github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    # The release cut wrote the release version into the chart's version and appVersion. A chart naming any other
    # version is refused before anything is packaged, so the chart, the images and every binary's --version name
    # one version (ADR-0049, ADR-0052). The chart is pushed as an OCI artifact beside the images, and it is signed
    # by the digest the push reports.
    - name: Package, push and sign the chart
      shell: bash
      working-directory: ./current
      env:
        ACTOR: ${{ github.actor }}
        REGISTRY_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name }}
      # yamllint disable-line rule:indentation
      run: |
        version="${TAG#v}"
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Release tag '${TAG}' does not name a release version."
          exit 1
        fi
        registry="${CHART_REGISTRY,,}"

        chart="$(mise exec -- helm show chart packaging/chart)"
        for field in version appVersion; do
          value="$(sed -n "s/^${field}: *\"\{0,1\}\([^\"]*\)\"\{0,1\} *$/\1/p" <<< "$chart")"
          if [[ "$value" != "$version" ]]; then
            echo "::error::The chart's ${field} is '${value}', and release ${TAG} is version ${version}."
            exit 1
          fi
        done
        mise exec -- helm package packaging/chart --destination "${RUNNER_TEMP}/chart"
        echo "$REGISTRY_TOKEN" | mise exec -- helm registry login ghcr.io --username "$ACTOR" --password-stdin
        echo "$REGISTRY_TOKEN" | mise exec -- cosign login ghcr.io --username "$ACTOR" --password-stdin
        mise exec -- helm push "${RUNNER_TEMP}/chart/mediated-mailbox-${version}.tgz" "oci://${registry}" 2>&1 | tee "${RUNNER_TEMP}/push.log"
        digest="$(sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' "${RUNNER_TEMP}/push.log")"
        if [[ -z "$digest" ]]; then
          echo "::error::helm push reported no digest to sign."
          exit 1
        fi
        mise exec -- cosign sign --yes "${registry}/mediated-mailbox@${digest}"

  # The command-line program, whose keygen subcommand writes the key pair, ships as static binaries attached to the
  # release, one per platform an operator runs it on, each signed keylessly by the identity that signs the images and
  # the chart. The signature is a Sigstore bundle attached beside its binary (ADR-0088).
  cli:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
    - name: Setup the release tag and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@d21b387fa6a35e48f78985a1e636ec728866981e # v2.8.0
      with:
        current_git_ref: ${{ github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build, sign and attach the command-line program's binaries
      shell: bash
      working-directory: ./current
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name }}
      # yamllint disable-line rule:indentation
      run: |
        version="${TAG#v}"
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Release tag '${TAG}' does not name a release version."
          exit 1
        fi
        out="${RUNNER_TEMP}/cli"
        mkdir -p "$out"
        for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
          os="${platform%/*}"
          arch="${platform#*/}"
          asset="${out}/mediated-mailbox-cli-${os}-${arch}"
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" mise exec -- go build -trimpath -ldflags="-s -w" -o "$asset" ./cli
          mise exec -- cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
        done
        gh release upload "$TAG" "$out"/* --clobber --repo "$GITHUB_REPOSITORY"

  # The key-generation check of the release (ADR-0088). Every binary of the command-line program attached to the
  # release is downloaded with its bundle and verified against this workflow's identity at the release's tag, a copy
  # with one byte changed must be refused, and the linux amd64 binary's keygen subcommand, on the runner's own
  # platform, writes a pair the library must seal to and open with. The library's half runs as a program of this
  # module, because a Go test runs only in the workflow of its kind (ADR-0124).
  keygen-check:
    needs: [cli]
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Setup the release tag and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@d21b387fa6a35e48f78985a1e636ec728866981e # v2.8.0
      with:
        current_git_ref: ${{ github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Download, verify and run the released command-line program's keygen subcommand
      shell: bash
      working-directory: ./current
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name }}
      # yamllint disable-line rule:indentation
      run: |
        assets="${RUNNER_TEMP}/assets"
        mkdir -p "$assets"
        gh release download "$TAG" --pattern 'mediated-mailbox-cli-*' --dir "$assets" --repo "$GITHUB_REPOSITORY"
        identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yaml@refs/tags/${TAG}"
        verify() {
          mise exec -- cosign verify-blob --bundle "$2" --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$1"
        }
        for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
          binary="${assets}/mediated-mailbox-cli-${platform}"
          verify "$binary" "${binary}.sigstore.json"
        done

        binary="${assets}/mediated-mailbox-cli-linux-amd64"
        tampered="${RUNNER_TEMP}/tampered"
        cp "$binary" "$tampered"
        byte="$(od -An -tu1 -j 4096 -N 1 "$binary" | tr -d ' ')"
        printf '%b' "\\$(printf '%03o' $(( byte ^ 255 )))" | dd of="$tampered" bs=1 seek=4096 count=1 conv=notrunc status=none
        if cmp -s "$binary" "$tampered"; then
          echo "::error::The tampered copy is the binary itself, so it proves nothing."
          exit 1
        fi
        if verify "$tampered" "${binary}.sigstore.json"; then
          echo "::error::A copy of the command-line program's binary with one byte changed passed its signature check."
          exit 1
        fi

        chmod +x "$binary"
        "$binary" -version
        "$binary" keygen -version
        pair="${RUNNER_TEMP}/pair"
        mkdir -p "$pair"
        "$binary" keygen -private-key-file "${pair}/credential.key" -public-key-file "${pair}/credential.pub"
        mise exec -- go tool keypaircheck -private-key-file "${pair}/credential.key" -public-key-file "${pair}/credential.pub"
