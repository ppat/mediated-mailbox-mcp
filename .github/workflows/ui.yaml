---
# yamllint disable rule:line-length
name: ui

# The UI in one job, in the order each stage's input is produced. The contract document comes first, then the
# types and descriptor table generated from it, the bundle, the Go code embedding the bundle with the fixtures it
# records, and the browser checks last.
# The recorded fixtures are functions of the server's output, so the migration chain is watched as well, and
# each data-access subsection the UI's list names joins it.
on:
  pull_request:
    paths:
    - .github/workflows/ui.yaml
    - go.mod
    - go.sum
    - mise.lock
    - mise.toml
    - db/migrations/**
    - db/accounts/**
    - db/accountstate/*
    - db/auditlog/**
    - db/jobruns/**
    - db/maskingevents/**
    - db/messages/**
    - db/policycandidates/**
    - db/ratestate/*
    - db/reorgoplog/**
    - db/reorgplans/**
    - db/scangatedecisions/**
    - db/tx/**
    - testsupport/cmd/banproof/**
    - ui/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@d21b387fa6a35e48f78985a1e636ec728866981e # v2.8.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install the browser layer's packages
      shell: bash
      working-directory: ./current/ui/browser
      run: |
        mise exec -- bun install --frozen-lockfile
        cd codegen
        mise exec -- bun install --frozen-lockfile

    - name: Compare the contract document with what the registry generates
      shell: bash
      working-directory: ./current
      run: mise exec -- go test ./ui/internal/contract

    - name: Compare the generated types and descriptor table with what the document generates
      shell: bash
      working-directory: ./current/ui/browser
      run: mise exec -- bun run check:generated

    - name: Build the bundle
      shell: bash
      working-directory: ./current/ui/browser
      run: mise exec -- bun run build

    # The Go tests run under go tool pgrun with -tags integration, so the server's tests against PostgreSQL run
    # here, and among them the one that records the browser's fixtures from the real server and fails when a
    # checked-in fixture differs (ADR-0064). That diff runs in this job because the browser tests read the fixtures.
    - name: Compile the UI with the bundle embedded and run its Go tests against one PostgreSQL container
      shell: bash
      working-directory: ./current
      run: |
        mise exec -- go build -o /dev/null ./ui
        mise exec -- go tool pgrun -- go test -tags integration ./ui/...

    - name: Type-check the browser layer
      shell: bash
      working-directory: ./current/ui/browser
      run: mise exec -- bun run typecheck

    - name: Check the browser layer's formatting
      shell: bash
      working-directory: ./current/ui/browser
      run: mise exec -- bun run fmt:check

    - name: Lint the browser layer
      shell: bash
      working-directory: ./current/ui/browser
      run: mise exec -- bun run lint

    - name: Prove every browser ban still fires
      shell: bash
      working-directory: ./current
      run: mise exec -- go tool banproof -browser

    - name: Run the browser tests
      shell: bash
      working-directory: ./current/ui/browser
      run: mise exec -- bun test
