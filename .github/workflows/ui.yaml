---
# yamllint disable rule:line-length
name: ui

# The UI in one job, in the order each stage's input is produced. The types and descriptor table generated from
# the contract document come first, then the bundle, the Go code embedding the bundle with the fixtures its tests
# record, and the browser checks last. The contract document's own comparison with the registry is a unit test of
# ui/internal/contract and runs in go-unit.yaml, and the UI's other Go tests run in the workflow of their kind
# (ADR-0124).
# The recorded fixtures are functions of the server's output, so the migration chain is watched as well, and
# each data-access subsection the UI's list names joins it.
on:
  pull_request:
    paths:
    - .github/workflows/ui.yaml
    - go.mod
    - go.sum
    - mise.lock
    - mise.toml
    - db/migrations/**
    - db/accounts/**
    - db/accountstate/*
    - db/auditlog/**
    - db/jobruns/**
    - db/maskingevents/**
    - db/messages/**
    - db/policycandidates/**
    - db/ratestate/*
    - db/reorgoplog/**
    - db/reorgplans/**
    - db/scangatedecisions/**
    - db/tx/**
    - testsupport/cmd/banproof/**
    - ui/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@d21b387fa6a35e48f78985a1e636ec728866981e # v2.8.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install the browser layer's packages
      shell: bash
      working-directory: ./current/ui/browser
      run: |
        mise exec -- bun install --frozen-lockfile
        cd codegen
        mise exec -- bun install --frozen-lockfile

    - name: Compare the generated types and descriptor table with what the document generates
      shell: bash
      working-directory: ./current/ui/browser
      run: mise exec -- bun run check:generated

    - name: Build the bundle
      shell: bash
      working-directory: ./current/ui/browser
      run: mise exec -- bun run build

    # The tests that record the browser's fixtures from the real server and fail when a checked-in fixture differs
    # run here, under go tool pgrun with -tags integration, because the browser tests read the fixtures and the
    # recording runs in their job (ADR-0064). They are the fixtures kind of ADR-0124, the files named
    # _fixtures_integration_test.go, which go tool testkinds selects, and no other workflow runs them.
    #
    # The run sets RAPID_SEED non-zero, RAPID_CHECKS to the gating case count and RAPID_NOFAILFILE=true, and passes
    # no -short, the values every gating test run sets (ADR-0069). testkinds fails when no such test exists, so the
    # step never passes having selected nothing.
    - name: Compile the UI with the bundle embedded and record its fixtures against one PostgreSQL container
      shell: bash
      working-directory: ./current
      env:
        RAPID_SEED: '1'
        RAPID_CHECKS: '200'
        RAPID_NOFAILFILE: 'true'
      # yamllint disable-line rule:indentation
      run: |
        mise exec -- go build -o /dev/null ./ui
        selection="$(mise exec -- go tool testkinds args fixtures integration)"
        mapfile -t args <<< "$selection"
        mise exec -- go tool pgrun -- go test "${args[@]}"

    - name: Type-check the browser layer
      shell: bash
      working-directory: ./current/ui/browser
      run: mise exec -- bun run typecheck

    - name: Check the browser layer's formatting
      shell: bash
      working-directory: ./current/ui/browser
      run: mise exec -- bun run fmt:check

    - name: Lint the browser layer
      shell: bash
      working-directory: ./current/ui/browser
      run: mise exec -- bun run lint

    - name: Prove every browser ban still fires
      shell: bash
      working-directory: ./current
      run: mise exec -- go tool banproof -browser

    - name: Run the browser tests
      shell: bash
      working-directory: ./current/ui/browser
      run: mise exec -- bun test
