---
# yamllint disable rule:line-length
name: secrets

# gitleaks over every commit a pull request adds, so a credential committed and then deleted in a later commit
# is still found. A manual run scans the whole history.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@1ca11af183c2f3f117e9e83638c3949a399070a0 # v2.6.0
      with:
        current_fetch_depth: 0
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Scan commits for secrets
      shell: bash
      working-directory: ./current
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # yamllint disable-line rule:indentation
      run: |
        if [[ -n "${BASE_SHA}" ]]; then
          mise exec -- gitleaks git --no-banner --redact --log-opts="${BASE_SHA}..${HEAD_SHA}"
        else
          mise exec -- gitleaks git --no-banner --redact
        fi
