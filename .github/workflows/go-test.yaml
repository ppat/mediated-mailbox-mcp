---
# yamllint disable rule:line-length
name: go-test

# The unit tests of every Go package. db/check reads .golangci.yaml's import lists, and ui/internal/contract
# compares ui/contract/openapi.json with what it generates, so both files are watched too.
#
# The gating run of property tests and crash sequences sets RAPID_SEED non-zero, RAPID_CHECKS to the gating case
# count and RAPID_NOFAILFILE=true, and passes no -short (ADR-0069). go-integration.yaml sets the same values.
on:
  pull_request:
    paths:
    - .github/workflows/go-test.yaml
    - .golangci.yaml
    - '*.go'
    - '**/*.go'
    - go.mod
    - go.sum
    - mise.lock
    - mise.toml
    - backfill/**
    - core/**
    - db/**
    - mediate/**
    - organize/**
    - propose/**
    - provider/**
    - ratelimit/**
    - sanitize/**
    - sync/**
    - testsupport/**
    - ui/*.go
    - ui/contract/**
    - ui/internal/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@2045fb6e6cb00ab099280625b6989cf62ccc1b77 # v2.7.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    # property.Check and property.Report fail a run whose seed is unset or zero or whose RAPID_NOFAILFILE is not true.
    - name: Run the unit tests
      shell: bash
      working-directory: ./current
      env:
        RAPID_SEED: '1'
        RAPID_CHECKS: '200'
        RAPID_NOFAILFILE: 'true'
      run: mise exec -- go test ./...
