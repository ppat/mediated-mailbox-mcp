---
# yamllint disable rule:line-length
name: go-crash-deep

# The deep search over the crash sequences the gating run of go-crash.yaml holds (ADR-0045, ADR-0069): more cases per crash sequence,
# the scheduled count of ADR-0069 set below, which a manual run may override, and a fresh seed each run. It
# never gates a pull request. It runs weekly and by hand, and on a pull request only when the pull request
# changes this file, so the workflow is exercised before the change lands.
on:
  schedule:
  - cron: '30 6 * * 1'
  workflow_dispatch:
    inputs:
      checks:
        description: Cases generated per crash sequence, overriding the scheduled count of 10000
        required: false
        type: string
  pull_request:
    paths:
    - .github/workflows/go-crash-deep.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A long search is never cancelled by the next one.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crash-deep:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SCHEDULED_CHECKS: ${{ inputs.checks || '10000' }}
      RAPID_NOFAILFILE: 'true'
      RAPID_SEED: ${{ github.run_id }}
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@d21b387fa6a35e48f78985a1e636ec728866981e # v2.8.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set the case count
      shell: bash
      # yamllint disable-line rule:indentation
      run: |
        if [[ ! "$SCHEDULED_CHECKS" =~ ^[0-9]+$ ]] || (( 10#$SCHEDULED_CHECKS == 0 )); then
          echo "::error::The checks input must be a positive number."
          exit 1
        fi
        echo "RAPID_CHECKS=${SCHEDULED_CHECKS}" >> "$GITHUB_ENV"
        echo "RAPID_SEED=${RAPID_SEED} RAPID_CHECKS=${SCHEDULED_CHECKS}" | tee -a "$GITHUB_STEP_SUMMARY"

    # rapid prints its OK line only under -v, and a search in which no crash sequence reported one generated no case, so
    # each step fails without it.
    - name: Explore the crash sequences against one PostgreSQL container
      shell: bash
      working-directory: ./current
      # yamllint disable-line rule:indentation
      run: |
        selection="$(mise exec -- go tool testkinds args crash integration)"
        mapfile -t args <<< "$selection"
        log="${RUNNER_TEMP}/deep-crash-integration.log"
        mise exec -- go tool pgrun -- go test -count=1 -timeout 110m -v "${args[@]}" | tee "$log"
        if ! grep -q '\[rapid\] OK, passed [1-9][0-9]* tests' "$log"; then
          echo "::error::No crash sequence reported a passed rapid run, so the deep search generated nothing."
          exit 1
        fi
