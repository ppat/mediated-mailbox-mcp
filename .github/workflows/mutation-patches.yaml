---
# yamllint disable rule:line-length
name: mutation-patches

# go tool mutproof -check over every mutation patch under a testdata/mutations directory, excluding
# mutproof's own fixtures under testsupport/cmd/mutproof/testdata/fixture/. It refuses a patch git
# apply --check refuses and a patch with a hunk whose context matches at more than one place in its
# file. Unconditional rather than path-filtered, because a patch's diff context can span any file in
# the tree, not only the package its control lives in.
#
# Its own workflow, run by neither go-unit nor go-integration. A patch's applicability is a
# standing guard on every pull request, apart from the mutation demonstration itself, which runs
# by hand when a control, its tests or a generator changes (ADR-0046), and in full in the
# mutation-demonstrations workflow on a schedule and on demand (ADR-0124).
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apply-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@d21b387fa6a35e48f78985a1e636ec728866981e # v2.8.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    # First, so that the verdict below comes from a checker that has just shown it catches a patch
    # whose context has gone stale and a hunk whose context matches twice.
    - name: Self-test
      shell: bash
      working-directory: ./current
      run: .github/scripts/mutation-patches/self-test.sh

    - name: Check every mutation patch applies at exactly one place
      shell: bash
      working-directory: ./current
      run: go tool mutproof -check
