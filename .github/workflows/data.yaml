---
# yamllint disable rule:line-length
name: data

# The data-access library's SQL lint and generated code. The db/check tests, which check statement files, the
# migration chain, generated code and import lists, run in the workflow of their kind (ADR-0124).
on:
  pull_request:
    paths:
    - .github/workflows/data.yaml
    - .golangci.yaml
    - .sqlfluff
    - .sqlfluffignore
    - go.mod
    - go.sum
    - mise.lock
    - mise.toml
    - db/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@d21b387fa6a35e48f78985a1e636ec728866981e # v2.8.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    # Layout and ambiguity checks for every SQL file under db/, apart from violation files (.sqlfluffignore).
    - name: Lint the SQL files
      shell: bash
      working-directory: ./current
      run: mise exec -- sqlfluff lint db/

    # sqlc diff fails on a hand-edited, deleted or out-of-date generated file. The test library's configuration
    # reads the real migration chain first, so this also fails on a chain the pinned sqlc cannot read.
    - name: Compare the test library's generated code with sqlc's output
      shell: bash
      working-directory: ./current/db/check/testdata
      run: mise exec -- sqlc diff

    - name: Compare the library's generated code with sqlc's output
      shell: bash
      working-directory: ./current/db
      run: mise exec -- sqlc diff
