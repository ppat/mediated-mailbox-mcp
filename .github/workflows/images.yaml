---
# yamllint disable rule:line-length
name: images

# Builds every image, publishing nothing, when an image's directory or a shared library an image copies changes.
# Every image builds together because the release publishes them together at one version (ADR-0049).
on:
  pull_request:
    paths:
    - .github/workflows/images.yaml
    - go.mod
    - go.sum
    - backfill/**
    - core/**
    - db/**
    - mediate/**
    - migrate/**
    - organize/**
    - policyload/**
    - propose/**
    - provider/**
    - ratelimit/**
    - sanitize/**
    - settings/**
    - sync/**
    - ui/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [backfill, mediate, migrate, organize, propose, sync, ui]
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Build the image
      uses: ppat/homelab-ops-actions/actions/build-docker-image@2045fb6e6cb00ab099280625b6989cf62ccc1b77 # v2.7.0
      with:
        image_context_path: .
        dockerfile: ${{ matrix.image }}/Dockerfile
        label_title: mediated-mailbox-${{ matrix.image }}

  # The UI's image must refuse a bundle directory holding only its checked-in placeholder. A named build context
  # called bundle replaces the Dockerfile's bundle stage, so the server stage copies a directory holding only the
  # placeholder, laid out at the path the bundle stage writes to. The build must fail with the guard's own output
  # line, so a build failing anywhere else does not pass this job. The build job above shows the guard passing a
  # real bundle.
  ui-placeholder:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Build the UI's image from the placeholder bundle
      shell: bash
      # yamllint disable-line rule:indentation
      run: |
        placeholder="${RUNNER_TEMP}/placeholder"
        log="${RUNNER_TEMP}/build.log"
        mkdir -p "${placeholder}/src/ui/browser/dist"
        cp ui/browser/dist/.gitkeep "${placeholder}/src/ui/browser/dist/"
        if docker buildx build --progress=plain --file ui/Dockerfile --build-context "bundle=${placeholder}" \
          --output type=cacheonly . >"${log}" 2>&1; then
          cat "${log}"
          echo "::error::The UI's image built from a bundle directory holding only its placeholder."
          exit 1
        fi
        cat "${log}"
        if ! grep -qE '^#[0-9]+ [0-9.]+ ui/browser/dist holds no bundle, only its placeholder\.' "${log}"; then
          echo "::error::The build failed, but not at the guard that refuses the placeholder bundle."
          exit 1
        fi
