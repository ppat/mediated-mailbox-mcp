---
# yamllint disable rule:line-length
name: lint

on:
  pull_request:
  workflow_dispatch:
  schedule:
  - cron: '0 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=lycheeverse/lychee
  LYCHEE_VERSION: "0.24.2"

jobs:
  detect-changes:
    uses: ppat/github-workflows/.github/workflows/detect-changed-files.yaml@e14e9bf7b53f4094382443db8bbff9e7d6b1e5b1 # v8.1.0
    with:
      # yamllint disable-line rule:indentation
      files_yaml: |
        actions:
        - .github/workflows/**
        markdown:
        - '**.md'
        - '!**/CHANGELOG.md'
        renovate:
        - .github/renovate.json
        shellscripts:
        - '**.sh'
        yaml:
        - '**.yaml'
        - '**.yml'
        zizmor:
        - .github/workflows/**
      git_ref: ${{ github.head_ref || github.ref }}

  commit-messages:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ppat/github-workflows/.github/workflows/lint-commit-messages.yaml@e14e9bf7b53f4094382443db8bbff9e7d6b1e5b1 # v8.1.0
    with:
      git_ref: ${{ github.head_ref }}
      fetch_depth: ${{ github.event.pull_request.commits || 0 }}
      from: ${{ github.event.pull_request.head.sha || 'HEAD' }}~${{ github.event.pull_request.commits || '1' }}
      to: ${{ github.event.pull_request.head.sha || 'HEAD' }}

  # Reports the bare context `commit-taxonomy`, which branch protection requires.
  #
  # No `paths:` filter, no `needs:` and no `if:`, and none may be added. A job gated by any of them reports
  # `skipped` on the runs it skips, and `skipped` SATISFIES a required status check: the gate would read as armed
  # and enforce nothing. The self-consistency step asserts these properties of this very job. The steps that need
  # a pull request find no commits on the schedule and dispatch runs and check nothing, which is the intended
  # shape: those runs exist for the repository-state steps, whose inputs go stale with no pull request in sight.
  #
  # Part of the verdict is a function of repository state rather than of the pull request, so when it goes red
  # it goes red on every open pull request at once. The step names are what tell a repository-state failure from
  # a pull-request one.
  commit-taxonomy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@2045fb6e6cb00ab099280625b6989cf62ccc1b77 # v2.7.0
      with:
        # Full history: the pull-request-state steps read each of the pull request's own commits and the paths it
        # touched, not a squashed diff.
        current_fetch_depth: 0
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    # commitlint comes from this repository's committed package.json and bun.lock, the same manifest the
    # commit-messages and pr-title jobs resolve, so the checker and the gates it predicts judge with one engine.
    - name: Install node packages
      working-directory: ./current
      shell: bash
      run: mise exec -- bun install --frozen-lockfile

    # First, so that everything below is a verdict from a checker that has just demonstrated it can see defects.
    - name: Self-test - every known defect must be caught
      working-directory: ./current
      shell: bash
      run: mise exec -- node .github/scripts/commit-taxonomy/self-test.mjs

    - name: Emission closure
      working-directory: ./current
      shell: bash
      run: mise exec -- node .github/scripts/commit-taxonomy/check-commit-taxonomy.mjs closure

    - name: Emission truth
      working-directory: ./current
      shell: bash
      run: mise exec -- node .github/scripts/commit-taxonomy/check-commit-taxonomy.mjs truth

    - name: Config self-consistency
      working-directory: ./current
      shell: bash
      run: mise exec -- node .github/scripts/commit-taxonomy/check-commit-taxonomy.mjs self-consistency

    # The pull-request-state steps. Untrusted text reaches them only through env, never through the shell.
    - name: Commit message shape
      working-directory: ./current
      shell: bash
      env:
        COMMIT_TAXONOMY_PR_COMMITS: ${{ github.event.pull_request.commits || 0 }}
        COMMIT_TAXONOMY_PR_BODY: ${{ github.event.pull_request.body }}
      run: mise exec -- node .github/scripts/commit-taxonomy/check-commit-taxonomy.mjs message-shape

    - name: Empty-scope concordance
      working-directory: ./current
      shell: bash
      env:
        COMMIT_TAXONOMY_PR_COMMITS: ${{ github.event.pull_request.commits || 0 }}
      run: mise exec -- node .github/scripts/commit-taxonomy/check-commit-taxonomy.mjs empty-scope

    # ADVISORY, and the script states the sunset it is held to. Nothing else in the estate enforces a named
    # scope against paths, so this ships without the power to block while it earns a track record.
    - name: Named-scope concordance (advisory)
      continue-on-error: true
      working-directory: ./current
      shell: bash
      env:
        COMMIT_TAXONOMY_PR_COMMITS: ${{ github.event.pull_request.commits || 0 }}
      run: mise exec -- node .github/scripts/commit-taxonomy/check-commit-taxonomy.mjs named-scope

  github-actions:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).actions_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-github-actions.yaml@e14e9bf7b53f4094382443db8bbff9e7d6b1e5b1 # v8.1.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).actions_all_changed_files }}

  links:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).markdown_any_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@2045fb6e6cb00ab099280625b6989cf62ccc1b77 # v2.7.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}
        mise_toml: |
          [tools]
          lychee = "${{ env.LYCHEE_VERSION }}"

    - name: Check links
      shell: bash
      working-directory: ./current
      env:
        # Only read on the full (online) run below -- resolves GitHub links via the API
        # instead of tripping anonymous rate limits.
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Internal file and #anchor links are what the top-level docs restructure (and
        # any future file rename) can silently break, and checking them needs no
        # network, so every pull_request touching Markdown gets that check: fast,
        # deterministic, and it never fails a PR for a reason unrelated to the diff.
        # External links are useful but a failure there is about the target site, not
        # this change; they're checked in full outside pull_request (schedule,
        # workflow_dispatch) instead, on the same weekly cadence this workflow already
        # runs everything else on -- link rot doesn't wait for a PR to notice it.
        offline_flag=""
        [ "${{ github.event_name }}" = "pull_request" ] && offline_flag="--offline"
        mise exec -- lychee --config lychee.toml --no-progress $offline_flag './**/*.md'

  markdown:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).markdown_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-markdown.yaml@e14e9bf7b53f4094382443db8bbff9e7d6b1e5b1 # v8.1.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).markdown_all_changed_files }}

  pre-commit:
    uses: ppat/github-workflows/.github/workflows/lint-pre-commit.yaml@e14e9bf7b53f4094382443db8bbff9e7d6b1e5b1 # v8.1.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}

  renovate-config-check:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).renovate_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-renovate-config-check.yaml@e14e9bf7b53f4094382443db8bbff9e7d6b1e5b1 # v8.1.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).renovate_all_changed_files }}

  shellcheck:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).shellscripts_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-shellcheck.yaml@e14e9bf7b53f4094382443db8bbff9e7d6b1e5b1 # v8.1.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).shellscripts_all_changed_files }}

  yaml:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).yaml_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-yaml.yaml@e14e9bf7b53f4094382443db8bbff9e7d6b1e5b1 # v8.1.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).yaml_all_changed_files }}

  zizmor:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).zizmor_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-zizmor.yaml@e14e9bf7b53f4094382443db8bbff9e7d6b1e5b1 # v8.1.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
