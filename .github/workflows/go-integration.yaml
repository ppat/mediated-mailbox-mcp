---
# yamllint disable rule:line-length
name: go-integration

on:
  pull_request:
    paths:
    - .github/workflows/go-integration.yaml
    - .golangci.yaml
    - '*.go'
    - '**/*.go'
    - go.mod
    - go.sum
    - mise.lock
    - mise.toml
    - backfill/**
    - core/**
    - db/**
    - mediate/**
    - organize/**
    - packaging/chart/alerting-rules.yaml
    - propose/**
    - provider/**
    - ratelimit/**
    - sanitize/**
    - sync/**
    - testsupport/**
    - ui/*.go
    - ui/contract/**
    - ui/internal/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@2045fb6e6cb00ab099280625b6989cf62ccc1b77 # v2.7.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    # Integration tests run only under go tool pgrun with -tags integration, here and in deep-tests.yaml, which adds
    # flags of its own. pgrun fails a run with the tag forgotten, because no test package creates a database, and
    # every integration package fails without pgrun. A step running plain go test ./... with neither passes while
    # running no integration test, and nothing but the workflow files can refuse that.
    #
    # This run also runs every property test and the crash sequences, so it sets RAPID_SEED non-zero, RAPID_CHECKS
    # to the gating case count and RAPID_NOFAILFILE=true, and passes no -short (ADR-0069, ADR-0045), the same
    # values go-test.yaml sets. property.Check and property.Report fail a run whose seed is unset or zero or whose
    # RAPID_NOFAILFILE is not true.
    - name: Run the integration tests against one PostgreSQL container
      shell: bash
      working-directory: ./current
      env:
        RAPID_SEED: '1'
        RAPID_CHECKS: '200'
        RAPID_NOFAILFILE: 'true'
      run: mise exec -- go tool pgrun -- go test -tags integration ./...
