---
# yamllint disable rule:line-length
name: go-integration

# The integration tests, the example tests that run against PostgreSQL under go tool pgrun (ADR-0124).
on:
  pull_request:
    paths:
    - .github/workflows/go-integration.yaml
    - .golangci.yaml
    - '*.go'
    - '**/*.go'
    - go.mod
    - go.sum
    - mise.lock
    - mise.toml
    - content/**
    - core/**
    - db/**
    - executioncontext/**
    - mediate/**
    - packaging/chart/alerting-rules.yaml
    - process/**
    - provider/**
    - ratelimit/**
    - testsupport/**
    - ui/*.go
    - ui/browser/bun.lock
    - ui/browser/bunfig.toml
    - ui/browser/package.json
    - ui/browser/scripts/**
    - ui/browser/src/**
    - ui/browser/tsconfig.json
    - ui/contract/**
    - ui/internal/**
    - worker/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@d21b387fa6a35e48f78985a1e636ec728866981e # v2.8.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}

    # The UI's tests read the built browser bundle, the policy scan of every bundled file, the entry document
    # loading the bundle's entry module, and the reserved words a bundle's top level holds, so the bundle is built
    # first, as the ui workflow builds it. A fresh clone holds only its placeholder, against which those tests skip
    # or check less.
    - name: Build the browser bundle the UI's tests read
      shell: bash
      working-directory: ./current/ui/browser
      # yamllint disable-line rule:indentation
      run: |
        mise exec -- bun install --frozen-lockfile
        mise exec -- bun run build

    # Integration tests run only under go tool pgrun with -tags integration, which testkinds passes. pgrun fails a
    # run with the tag forgotten, because no test package creates a database, and every integration package fails
    # without pgrun. The run holds the example tests of the integration level and no other kind (ADR-0124). The
    # integration property tests run in go-property.yaml, the crash sequences in go-crash.yaml, and the tests that
    # record the browser's fixtures in ui.yaml, so testkinds selects these by name and package.
    #
    # The run sets RAPID_SEED non-zero, RAPID_CHECKS to the gating case count and RAPID_NOFAILFILE=true, and passes
    # no -short, the values every gating test run sets (ADR-0069). testkinds fails when no integration test exists,
    # so the run never passes having selected nothing.
    - name: Run the integration tests against one PostgreSQL container
      shell: bash
      working-directory: ./current
      env:
        RAPID_SEED: '1'
        RAPID_CHECKS: '200'
        RAPID_NOFAILFILE: 'true'
      # yamllint disable-line rule:indentation
      run: |
        selection="$(mise exec -- go tool testkinds args integration integration)"
        mapfile -t args <<< "$selection"
        mise exec -- go tool pgrun -- go test "${args[@]}"
