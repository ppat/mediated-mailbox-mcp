---
# No hook reads these files.
# - Generated files, whose checks regenerate and compare, so a fixer's rewrite fails them: the contract document,
#   the browser's generated types and sqlc's output, in the library and in db/check's test library.
# - Lock files, which bun writes.
# - Golden files and the browser tests' recorded JSON, which tests compare byte for byte.
# - Mutation patches, whose context lines git apply matches exactly, so stripping a trailing space stops a patch
#   applying.
# - The synthetic fixtures' test data, where mail uses CRLF line endings and may carry characters the text
#   fixers replace on purpose.
# - Helm templates, which are Go templates rather than YAML.
exclude: |
  (?x)^(
  ui/contract/openapi\.json|
  ui/browser/src/generated/.*|
  db/(.+/)?(db|models|querier|[^/]+\.sql)\.go|
  ui/browser/(codegen/)?bun\.lock|
  (.+/)?testdata/golden/.*|
  (.+/)?testdata/mutations/[^/]+\.patch|
  ui/browser/test/.*\.json|
  testsupport/fixture/testdata/.*|
  packaging/chart/templates/.*
  )$
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-executables-have-shebangs
  - id: check-json
  - id: check-shebang-scripts-are-executable
  - id: check-toml
  - id: detect-private-key
  - id: end-of-file-fixer
  - id: forbid-new-submodules
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: trailing-whitespace
- repo: https://github.com/sirosen/texthooks
  rev: 0.7.1
  hooks:
  - id: fix-smartquotes
  - id: fix-ligatures
  - id: fix-spaces
- repo: https://github.com/adrienverge/yamllint.git
  rev: v1.38.0
  hooks:
  - id: yamllint
    args: [--strict]
- repo: https://github.com/DavidAnson/markdownlint-cli2
  rev: v0.23.2
  hooks:
  - id: markdownlint-cli2
    args: ["--fix", "--config", ".markdownlint-cli2.yaml"]
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1
  hooks:
  - id: shellcheck
# Local hooks run the tools pinned in mise.toml and ui/browser/package.json, so a hook and CI use one version.
# The reusable pre-commit workflow in CI runs only its own named hooks, so each of these tools also runs in a
# workflow here: golangci-lint's formatters under go-lint, oxfmt under ui, sqlfluff under data, hadolint under
# dockerfiles and gitleaks under secrets.
- repo: local
  hooks:
  - id: golangci-lint-fmt
    name: golangci-lint fmt
    entry: mise exec -- golangci-lint fmt
    language: system
    types: [go]
    # Test data holds packages that do not compile on purpose.
    exclude: (^|/)testdata/
  - id: oxfmt
    name: oxfmt
    # .oxfmtrc.json skips generated code and violation files. Needs bun install in ui/browser.
    entry: mise exec -- bun --cwd=ui/browser run fmt
    language: system
    files: ^ui/browser/.*\.tsx?$
    pass_filenames: false
  - id: sqlfluff-lint
    name: sqlfluff lint
    # sqlfluff fix rewrites a file. A statement file it rewrites needs sqlc generate afterwards.
    entry: mise exec -- sqlfluff lint
    language: system
    types: [sql]
    # Violation files carry want annotations that point at lines (.sqlfluffignore).
    exclude: ^db/check/testdata/violations/
  - id: hadolint
    name: hadolint
    entry: mise exec -- hadolint --failure-threshold warning
    language: system
    files: (^|/)Dockerfile$
  - id: gitleaks
    name: gitleaks
    entry: mise exec -- gitleaks git --pre-commit --staged --redact --no-banner
    language: system
    pass_filenames: false
    always_run: true
- repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
  rev: v9.26.0
  hooks:
  - id: commitlint
    stages: [commit-msg]
    additional_dependencies:
    - '@commitlint/cli@21.2.1'
    - '@commitlint/config-conventional@21.2.0'
    - '@commitlint/ensure@21.2.0'
    - 'commitlint-plugin-function-rules@5.0.1'
    args: ['--verbose']
