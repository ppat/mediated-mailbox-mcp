---
# Test input for the sqlc.yaml layout check and the declares-no-types assertion. sqlc never runs over it,
# and it names no statement file.
#
# Blocks 0 and 6 follow the layout and were never generated, so their directories hold no db.go, which the
# assertion must report. Block 6 generates into a directory two segments down, a package whose name ends with
# its last segment. Every other block breaks one clause of the layout, which the layout check must report, and
# blocks 7 and 8 each follow it alone but give their packages one name.
version: "2"
sql:
- engine: postgresql
  schema: [../../../migrations, ../migrations]
  queries: ungenerated
  gen:
    go:
      package: ungenerated
      out: ungenerated
- engine: mysql
  schema: [../../../migrations, ../migrations]
  queries: engine
  gen:
    go:
      package: engine
      out: engine
- engine: postgresql
  schema: [../../../migrations]
  queries: chain
  gen:
    go:
      package: chain
      out: chain
- engine: postgresql
  schema: [../../../migrations, ../migrations]
  queries: statements
  gen:
    go:
      package: moved
      out: moved
- engine: postgresql
  schema: [../../../migrations, ../migrations]
  queries: named
  gen:
    go:
      package: other
      out: named
- engine: postgresql
  schema: [../../../migrations, ../migrations]
  queries: nested/dir
  gen:
    go:
      package: nested/dir
      out: nested/dir
- engine: postgresql
  schema: [../../../migrations, ../migrations]
  queries: nested/ungenerated
  gen:
    go:
      package: nestedungenerated
      out: nested/ungenerated
- engine: postgresql
  schema: [../../../migrations, ../migrations]
  queries: first/twice
  gen:
    go:
      package: twice
      out: first/twice
- engine: postgresql
  schema: [../../../migrations, ../migrations]
  queries: second/twice
  gen:
    go:
      package: twice
      out: second/twice
