---
# Import lists for the test library, in the shape of the repository's .golangci.yaml. db/check reads the
# data-access entries of each list, and its tests require exactly the problems the lists below carry.
version: "2"
linters:
  settings:
    depguard:
      rules:
        # A library-wide list, which may admit the whole library.
        db:
          allow:
          - "github.com/ppat/mediated-mailbox-mcp/db/"

        # Names only a subsection the test library's user can run.
        reader:
          allow:
          - "github.com/ppat/mediated-mailbox-mcp/db/listing$"
          - "github.com/ppat/mediated-mailbox-mcp/db/tx$"

        # Names a subsection whose update the test library's user holds no grant for.
        misaligned:
          allow:
          - "github.com/ppat/mediated-mailbox-mcp/db/counting$"

        # Admits every subsection through a prefix.
        prefix:
          allow:
          - "github.com/ppat/mediated-mailbox-mcp/db/"

        # Admits the library's root package, by its exact path and by a prefix of it that stops before its
        # last segment's end.
        rootpackage:
          allow:
          - "github.com/ppat/mediated-mailbox-mcp/db$"
          - "github.com/ppat/mediated-mailbox-mcp/d"

        # A library's list, naming a subsection whose update the test library's user holds no grant for. A
        # library's list is planned like any other.
        library:
          files:
          - "${base-path}/fixturelib/**.go"
          allow:
          - "github.com/ppat/mediated-mailbox-mcp/db/counting$"

        # A cross-cutting list, which may admit the library's root package by a wide prefix.
        everything:
          allow:
          - "github.com/ppat/mediated-mailbox-mcp/"

        # A second library's list, naming a subsection the test library's user can run.
        chained:
          files:
          - "${base-path}/chainlib/**.go"
          allow:
          - "github.com/ppat/mediated-mailbox-mcp/db/listing$"
          - "github.com/ppat/mediated-mailbox-mcp/fixturelib/lease$"
