{{- /*
The UI, deployed apart from the mediator, with a service account and database role of its own (ADR-0084), under the
same hardening as the deployables that call a provider (ADR-0028). It seals to the public key and its one
client-secret part opens with the private keys, so it mounts the key pair (ADR-0081). It serves TLS from its mounted
key pair, and its probes and metrics endpoint listen apart in plain HTTP.
*/ -}}
{{- $ctx := dict "root" . "component" "ui" "config" true -}}
{{- $v := .Values.ui -}}
{{- with include "mediated-mailbox.serviceAccount" $ctx }}
---
{{ . }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mediated-mailbox.componentName" $ctx }}
  labels:
    {{- include "mediated-mailbox.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $v.replicaCount }}
  selector:
    matchLabels:
      {{- include "mediated-mailbox.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      {{- include "mediated-mailbox.podMetadata" $ctx | nindent 6 }}
    spec:
      {{- include "mediated-mailbox.podSpec" $ctx | nindent 6 }}
      containers:
      - name: ui
        {{- include "mediated-mailbox.container" $ctx | nindent 8 }}
        args:
        {{- include "mediated-mailbox.configArgs" $ctx | nindent 8 }}
        ports:
        - name: ui
          containerPort: 8443
        - name: probes
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: probes
        readinessProbe:
          httpGet:
            path: /readyz
            port: probes
        volumeMounts:
        {{- include "mediated-mailbox.configMount" $ctx | nindent 8 }}
        {{- include "mediated-mailbox.databaseMounts" $ctx | nindent 8 }}
        {{- include "mediated-mailbox.keysMount" $ctx | nindent 8 }}
        - name: tls
          mountPath: /var/run/mediated-mailbox/tls
          readOnly: true
        {{- if $v.tokenKeySecret.name }}
        - name: token-key
          mountPath: /var/run/mediated-mailbox/token-key
          readOnly: true
        {{- end }}
      volumes:
      {{- include "mediated-mailbox.configVolume" $ctx | nindent 6 }}
      {{- include "mediated-mailbox.databaseVolumes" $ctx | nindent 6 }}
      {{- include "mediated-mailbox.keysVolume" $ctx | nindent 6 }}
      - name: tls
        secret:
          secretName: {{ required "ui.tls.secretName is required" $v.tls.secretName }}
          defaultMode: 0440
      {{- with $v.tokenKeySecret.name }}
      - name: token-key
        secret:
          secretName: {{ . }}
          defaultMode: 0440
          items:
          - key: {{ $v.tokenKeySecret.key }}
            path: key
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mediated-mailbox.componentName" $ctx }}
  labels:
    {{- include "mediated-mailbox.labels" $ctx | nindent 4 }}
spec:
  type: {{ $v.service.type }}
  selector:
    {{- include "mediated-mailbox.selectorLabels" $ctx | nindent 4 }}
  ports:
  - name: ui
    port: {{ $v.service.port }}
    targetPort: ui
  - name: probes
    port: 8080
    targetPort: probes
{{- with include "mediated-mailbox.ingress" $ctx }}
---
{{ . }}
{{- end }}
{{- with include "mediated-mailbox.httpRoute" $ctx }}
---
{{ . }}
{{- end }}
