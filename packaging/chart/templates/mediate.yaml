{{- /*
The mediator: the client surface, and the probes and metrics endpoint on their own plain-HTTP listener. It calls a
provider, so it mounts the key pair (ADR-0081). The surface serves TLS from the mounted key pair unless an ingress in
front is declared to terminate it. Its root filesystem is read-only and it mounts no writable volume, so nothing it
holds can spill to a disk (ADR-0009).
*/ -}}
{{- $ctx := dict "root" . "component" "mediate" "config" true -}}
{{- $v := .Values.mediate -}}
{{- with include "mediated-mailbox.serviceAccount" $ctx }}
---
{{ . }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mediated-mailbox.componentName" $ctx }}
  labels:
    {{- include "mediated-mailbox.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $v.replicaCount }}
  selector:
    matchLabels:
      {{- include "mediated-mailbox.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      {{- include "mediated-mailbox.podMetadata" $ctx | nindent 6 }}
    spec:
      {{- include "mediated-mailbox.podSpec" $ctx | nindent 6 }}
      containers:
      - name: mediate
        {{- include "mediated-mailbox.container" $ctx | nindent 8 }}
        args:
        {{- include "mediated-mailbox.configArgs" $ctx | nindent 8 }}
        ports:
        - name: surface
          containerPort: 8443
        - name: probes
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: probes
        readinessProbe:
          httpGet:
            path: /readyz
            port: probes
        volumeMounts:
        {{- include "mediated-mailbox.configMount" $ctx | nindent 8 }}
        {{- include "mediated-mailbox.databaseMounts" $ctx | nindent 8 }}
        {{- include "mediated-mailbox.keysMount" $ctx | nindent 8 }}
        - name: token
          mountPath: /var/run/mediated-mailbox/token
          readOnly: true
        {{- if not $v.tls.atIngress }}
        - name: tls
          mountPath: /var/run/mediated-mailbox/tls
          readOnly: true
        {{- end }}
      volumes:
      {{- include "mediated-mailbox.configVolume" $ctx | nindent 6 }}
      {{- include "mediated-mailbox.databaseVolumes" $ctx | nindent 6 }}
      {{- include "mediated-mailbox.keysVolume" $ctx | nindent 6 }}
      - name: token
        secret:
          secretName: {{ required "mediate.tokenSecret.name is required" $v.tokenSecret.name }}
          defaultMode: 0440
          items:
          - key: {{ $v.tokenSecret.key }}
            path: token
      {{- if not $v.tls.atIngress }}
      - name: tls
        secret:
          secretName: {{ required "mediate.tls.secretName is required unless mediate.tls.atIngress is set" $v.tls.secretName }}
          defaultMode: 0440
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mediated-mailbox.componentName" $ctx }}
  labels:
    {{- include "mediated-mailbox.labels" $ctx | nindent 4 }}
spec:
  type: {{ $v.service.type }}
  selector:
    {{- include "mediated-mailbox.selectorLabels" $ctx | nindent 4 }}
  ports:
  - name: surface
    port: {{ $v.service.port }}
    targetPort: surface
  - name: probes
    port: 8080
    targetPort: probes
{{- with include "mediated-mailbox.ingress" $ctx }}
---
{{ . }}
{{- end }}
{{- with include "mediated-mailbox.httpRoute" $ctx }}
---
{{ . }}
{{- end }}
