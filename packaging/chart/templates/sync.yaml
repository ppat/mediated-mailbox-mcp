{{- /*
Delta sync, one process that runs until stopped and is never two at once, a rollout included (ADR-0103): a
Deployment of one replica whose Recreate strategy ends the old pod before it starts the new one. It calls a provider,
so it mounts the key pair (ADR-0081). It serves only the health probe and the metrics endpoint. Its root filesystem
is read-only and it mounts no writable volume (ADR-0009).
*/ -}}
{{- $ctx := dict "root" . "component" "sync" "config" true -}}
{{- with include "mediated-mailbox.serviceAccount" $ctx }}
---
{{ . }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mediated-mailbox.componentName" $ctx }}
  labels:
    {{- include "mediated-mailbox.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "mediated-mailbox.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      {{- include "mediated-mailbox.podMetadata" $ctx | nindent 6 }}
    spec:
      {{- include "mediated-mailbox.podSpec" $ctx | nindent 6 }}
      containers:
      - name: sync
        {{- include "mediated-mailbox.container" $ctx | nindent 8 }}
        args:
        {{- include "mediated-mailbox.configArgs" $ctx | nindent 8 }}
        ports:
        - name: probes
          containerPort: 8080
        livenessProbe:
          httpGet:
            path: /healthz
            port: probes
        readinessProbe:
          httpGet:
            path: /healthz
            port: probes
        volumeMounts:
        {{- include "mediated-mailbox.configMount" $ctx | nindent 8 }}
        {{- include "mediated-mailbox.databaseMounts" $ctx | nindent 8 }}
        {{- include "mediated-mailbox.keysMount" $ctx | nindent 8 }}
      volumes:
      {{- include "mediated-mailbox.configVolume" $ctx | nindent 6 }}
      {{- include "mediated-mailbox.databaseVolumes" $ctx | nindent 6 }}
      {{- include "mediated-mailbox.keysVolume" $ctx | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mediated-mailbox.componentName" $ctx }}
  labels:
    {{- include "mediated-mailbox.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "mediated-mailbox.selectorLabels" $ctx | nindent 4 }}
  ports:
  - name: probes
    port: 8080
    targetPort: probes
