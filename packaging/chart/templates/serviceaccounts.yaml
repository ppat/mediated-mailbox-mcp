{{- /* One ServiceAccount per deployable. No process calls the Kubernetes API, so no token is mounted. */ -}}
{{- range $component, $values := dict "mediator" .Values.mediator "ui" .Values.ui "worker" .Values.worker }}
{{- if $values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mm.serviceAccountName" (list $ $component $values.serviceAccount) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "mm.labels" (list $ $component) | nindent 4 }}
  {{- with $values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
