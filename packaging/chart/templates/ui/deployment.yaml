{{- /*
The UI, which the operator works in. The pod mounts its own configuration file and one projected volume holding
exactly the secret files the UI reads: its role's password, the key pair, the request token key, and the CA
certificate and TLS pair when given (ADR-0079). The UI opens an OAuth client's secret with the private key (ADR-0081).
*/ -}}
{{- $v := .Values.ui }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mm.componentName" (list $ "ui") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mm.labels" (list $ "ui") | nindent 4 }}
spec:
  replicas: {{ $v.replicaCount }}
  selector:
    matchLabels:
      {{- include "mm.selectorLabels" (list $ "ui") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "mm.config.ui" . | sha256sum }}
        {{- with $v.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mm.labels" (list $ "ui") | nindent 8 }}
        {{- with $v.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "mm.serviceAccountName" (list $ "ui" $v.serviceAccount) }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with $v.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- include "mm.podSecurityContext" (list $ $v) | nindent 8 }}
      containers:
      - name: ui
        image: {{ include "mm.image" (list $ $v.image) }}
        imagePullPolicy: {{ .Values.global.image.pullPolicy }}
        args:
        - --config-file={{ include "mm.configDir" . }}/ui.yaml
        ports:
        - name: http
          containerPort: {{ include "mm.port.http" . }}
          protocol: TCP
        - name: metrics
          containerPort: {{ include "mm.port.metrics" . }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: metrics
        readinessProbe:
          httpGet:
            path: /readyz
            port: metrics
        securityContext:
          {{- include "mm.securityContext" (list $ $v) | nindent 10 }}
        {{- with $v.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - name: config
          mountPath: {{ include "mm.configDir" . }}
          readOnly: true
        - name: secrets
          mountPath: {{ include "mm.secretsDir" . }}
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: {{ include "mm.fullname" . }}-config
          items:
          - key: ui.yaml
            path: ui.yaml
      - name: secrets
        projected:
          defaultMode: 0440
          sources:
          - secret:
              name: {{ required "secrets.databasePasswords.ui.existingSecret is required" .Values.secrets.databasePasswords.ui.existingSecret }}
              items:
              - key: {{ .Values.secrets.databasePasswords.ui.secretKeys.password }}
                path: database/password
          {{- include "mm.credentialSealingKeyPairSource" . | nindent 10 }}
          - secret:
              name: {{ include "mm.uiRequestTokenKeySecretName" . }}
              items:
              - key: {{ .Values.secrets.uiRequestTokenKey.secretKeys.requestTokenKey }}
                path: request-token-key
          {{- include "mm.databaseCaCertificateSource" . | nindent 10 }}
          {{- with .Values.secrets.uiTls.existingSecret }}
          - secret:
              name: {{ . }}
              items:
              - key: {{ $.Values.secrets.uiTls.secretKeys.certificate }}
                path: tls/tls.crt
              - key: {{ $.Values.secrets.uiTls.secretKeys.privateKey }}
                path: tls/tls.key
          {{- end }}
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
