{{- /* The API server's Service: the client surface on http, and the plain-HTTP probes and metrics on metrics. */ -}}
{{- $v := .Values.api }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mm.componentName" (list $ "api") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mm.labels" (list $ "api") | nindent 4 }}
  {{- with $v.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $v.service.type }}
  selector:
    {{- include "mm.selectorLabels" (list $ "api") | nindent 4 }}
  ports:
  - name: http
    port: {{ $v.service.port }}
    targetPort: http
    protocol: TCP
    appProtocol: {{ if .Values.secrets.apiTls.existingSecret }}https{{ else }}http{{ end }}
  - name: metrics
    port: {{ include "mm.port.metrics" . }}
    targetPort: metrics
    protocol: TCP
