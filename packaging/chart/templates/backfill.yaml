{{- /*
Backfill, a batch job that exits when its run ends (ADR-0022, ADR-0051). It calls a provider, so it mounts the key
pair (ADR-0081). Its root filesystem is read-only and it mounts no writable volume (ADR-0009).

Two objects run the one pod template below (ADR-0116):

- A Job whose name carries a hash of the pod template. A release changes the image and a change to the scanner's
  section changes backfill's configuration file, whose checksum the template carries, and either changes the hash, so
  the next install or upgrade runs backfill under a new name with no manual step, which re-scans and re-decides what
  the change made stale (ADR-0096, ADR-0098). An upgrade that leaves the template as it was leaves the finished Job in
  place and runs nothing, and so does a reconcile that changes nothing.
- A suspended CronJob, never scheduled, which is how the operator starts backfill by hand, as its first start after
  connecting an account and whenever it should run again:
  kubectl create job --from=cronjob/<fullname>-backfill <name>
*/ -}}
{{- define "mediated-mailbox.backfillPod" -}}
{{- $ctx := dict "root" . "component" "backfill" "config" true -}}
metadata:
  {{- include "mediated-mailbox.podMetadata" $ctx | nindent 2 }}
spec:
  {{- include "mediated-mailbox.podSpec" $ctx | nindent 2 }}
  restartPolicy: Never
  containers:
  - name: backfill
    {{- include "mediated-mailbox.container" $ctx | nindent 4 }}
    args:
    {{- include "mediated-mailbox.configArgs" $ctx | nindent 4 }}
    ports:
    - name: probes
      containerPort: 8080
    volumeMounts:
    {{- include "mediated-mailbox.configMount" $ctx | nindent 4 }}
    {{- include "mediated-mailbox.databaseMounts" $ctx | nindent 4 }}
    {{- include "mediated-mailbox.keysMount" $ctx | nindent 4 }}
  volumes:
  {{- include "mediated-mailbox.configVolume" $ctx | nindent 2 }}
  {{- include "mediated-mailbox.databaseVolumes" $ctx | nindent 2 }}
  {{- include "mediated-mailbox.keysVolume" $ctx | nindent 2 }}
{{- end }}
{{- $ctx := dict "root" . "component" "backfill" -}}
{{- $pod := include "mediated-mailbox.backfillPod" . -}}
{{- $name := include "mediated-mailbox.componentName" $ctx -}}
{{- with include "mediated-mailbox.serviceAccount" $ctx }}
---
{{ . }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%s" ($name | trunc 52 | trimSuffix "-") ($pod | sha256sum | trunc 10) }}
  labels:
    {{- include "mediated-mailbox.labels" $ctx | nindent 4 }}
spec:
  backoffLimit: {{ .Values.backfill.backoffLimit }}
  template:
    {{- $pod | nindent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  labels:
    {{- include "mediated-mailbox.labels" $ctx | nindent 4 }}
spec:
  # Never scheduled. The CronJob exists to be started by hand.
  suspend: true
  schedule: "0 0 1 1 *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backfill.backoffLimit }}
      template:
        {{- $pod | nindent 8 }}
