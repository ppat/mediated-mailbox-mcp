# Every value the chart requires, set to placeholders, so a render needs nothing more. The chart's Go tests and the
# alerting rules' test render with it.
database:
  host: db.example
  name: mediated_mailbox
secrets:
  databasePasswords:
    api:
      existingSecret: api-db
    ui:
      existingSecret: ui-db
    worker:
      backfill:
        existingSecret: backfill-db
      sync:
        existingSecret: sync-db
    migration:
      existingSecret: migrator-db
  credentialSealingKeyPair:
    existingSecret: sealing-keys
