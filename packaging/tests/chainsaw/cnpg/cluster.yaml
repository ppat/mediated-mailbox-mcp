---
# The database, owned by the migrator's user, which CloudNativePG creates with a generated password it writes under the
# key password into the Secret mailbox-db-app, and the application user the migration chain grants to, which exists
# before the chain runs. Both names are the suite's own choice, since the system names no database user (ADR-0143).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mailbox-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie@sha256:c9be7f221a05b18fe65259d9136affbabe3b39ad91c3b68f8f2f990a45f35f38
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: mediated_mailbox
      owner: mailbox_migrator
  managed:
    roles:
    - name: mailbox_app
      login: true
      passwordSecret:
        name: app-db
