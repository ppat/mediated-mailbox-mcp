---
# The application user's password, as the basic-auth Secret CloudNativePG's managed roles read, whose username must
# equal the user. The label has CloudNativePG apply a changed password at once. The user's name is the suite's own
# choice, since the system names no database user (ADR-0143).
apiVersion: v1
kind: Secret
metadata:
  name: app-db
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: mailbox_app
  password: app-test-password
