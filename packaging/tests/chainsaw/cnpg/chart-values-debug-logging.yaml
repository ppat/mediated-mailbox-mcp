---
# The values of chart-values.yaml with debug logging, the configuration change the upgrade step makes.
database:
  host: mailbox-db-rw.${NAMESPACE}.svc.cluster.local
  name: mediated_mailbox
  applicationUser: mailbox_app
  migrationUser: mailbox_migrator
sharedConfig:
  log_level: debug
secrets:
  databasePasswords:
    application:
      existingSecret: app-db
    migration:
      existingSecret: mailbox-db-app
  databaseCaCertificate:
    existingSecret: mailbox-db-ca
  credentialSealingKeyPair:
    existingSecret: sealing-keys
