# Link checker config, used by the `links` job in `.github/workflows/lint.yaml`.
#
# Internal links (relative file paths and `#anchor` fragments) are the point of this
# checker: the top-level docs cross-reference each other and their own sections
# extensively, and a file rename elsewhere in the repo silently breaks both kinds. The
# `links` job runs this config in `--offline` mode on every PR that touches Markdown, so
# that check is fast, deterministic, and never fails a PR for a reason unrelated to the
# diff. Anchor checking must be turned on explicitly -- lychee ignores fragments by
# default.
include_fragments = "anchor-only"

# CHANGELOG.md is generated by release-please and is explicitly not something anyone
# hand-edits (see CLAUDE.md); its links are compare/issue/commit URLs against past
# releases and carry nothing this checker exists to catch. Matches the `!**/CHANGELOG.md`
# exclusion already used for markdown-lint in `.github/workflows/lint.yaml`.
exclude_path = ["(^|/)CHANGELOG\\.md$"]

# The settings below only take effect on the full (online) run outside pull_request
# (schedule, workflow_dispatch) -- see the `links` job for why external checking doesn't
# run on every PR. Kept modest because this repo links to a handful of external hosts,
# not the ~100+ of a survey-heavy repo.
max_retries = 3
retry_wait_time = 3
timeout = 20

# Some hosts reject HEAD but answer GET.
method = "get"

# 429 means the host is there and rate-limiting us, not a broken link, and must not fail
# the build.
accept = ["200", "202", "206", "429"]
